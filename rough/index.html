<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rough Plan · Ranfurlie</title>
<meta name="description" content="Ranfurlie rough plan for summer 2026–27: where the 4300 mows, where the surrounds mower goes to the bunker edge, what is left to grow and where fescue is seeded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Ranfurlie Rough Plan, crew view v1 (24 Oct 2026). Read-only copy of the rough plan, in the Ranfurlie glass look
   (frosted panels over a soft sky, Barlow). Map of the plan with a side card that drills course > hole > area.
   Map overlay colours sit on the aerial photo, so they stay the same in light and dark. */
:root{
  color-scheme:light;
  --bg:#e4f1f7;
  --sky1:#7fd3ff; --sky2:#86e8b4; --sky3:#ffe08a; --sky4:#b9c8ff;
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.8); --rim:rgba(255,255,255,.9); --edge:rgba(16,52,72,.10);
  --shadow:0 18px 40px -18px rgba(14,52,76,.35),0 2px 6px -2px rgba(14,52,76,.12);
  --fg:#0b2231; --muted:#3f5d6e; --faint:#6f8a99; --line:rgba(16,52,72,.12); --chip:rgba(255,255,255,.55);
  --go:#13a356; --go-soft:rgba(47,210,122,.18); --tank:#0aa6dc; --tank-deep:#0573a8; --warn:#a86000;
  --mow:#2d93e6; --grow:#e3ad2f; --seed:#34c77b; --surr:#b98cff; --sel:#ff5a36;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --r2:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#06121b; --sky1:#0a6fa8; --sky2:#0d7a4c; --sky3:#5a4a12; --sky4:#2a2f7a;
  --glass:rgba(18,40,56,.6); --glass-hi:rgba(28,58,78,.7); --rim:rgba(255,255,255,.2); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.4);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.08);
  --go:#2fd27a; --go-soft:rgba(47,210,122,.18); --tank:#38c6ff; --tank-deep:#38c6ff; --warn:#ffbc45;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#06121b; --sky1:#0a6fa8; --sky2:#0d7a4c; --sky3:#5a4a12; --sky4:#2a2f7a;
  --glass:rgba(18,40,56,.6); --glass-hi:rgba(28,58,78,.7); --rim:rgba(255,255,255,.2); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.4);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.08);
  --go:#2fd27a; --go-soft:rgba(47,210,122,.18); --tank:#38c6ff; --tank-deep:#38c6ff; --warn:#ffbc45;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.02;text-wrap:balance}
button{font:inherit;color:inherit}
a{color:var(--tank-deep)}
:focus-visible{outline:3px solid var(--tank);outline-offset:2px;border-radius:10px}

.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.sky i{position:absolute;border-radius:50%;filter:blur(8px);opacity:.8}
.sky i:nth-child(1){width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(circle,var(--sky1) 0,transparent 62%);animation:drift1 38s ease-in-out infinite alternate}
.sky i:nth-child(2){width:75vmax;height:75vmax;right:-34vmax;top:18vh;background:radial-gradient(circle,var(--sky2) 0,transparent 62%);animation:drift2 44s ease-in-out infinite alternate}
.sky i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-30vmax;background:radial-gradient(circle,var(--sky3) 0,transparent 60%);opacity:.55;animation:drift1 52s ease-in-out infinite alternate-reverse}
.sky i:nth-child(4){width:55vmax;height:55vmax;right:-20vmax;bottom:-26vmax;background:radial-gradient(circle,var(--sky4) 0,transparent 62%);opacity:.5;animation:drift2 47s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(1.1)}}

.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass) 38%,var(--glass));-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge),var(--shadow);border-radius:var(--r)}

/* header */
.top{position:sticky;top:0;z-index:1000;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px}
.topin{display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.row1{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-size:clamp(28px,4vw,38px);text-transform:uppercase;letter-spacing:.02em}
.brand h1 span{color:var(--go)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill b{color:var(--fg);font-weight:700}
.holes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.holes button{flex:0 0 auto;min-width:40px;height:38px;padding:0 10px;border:0;border-radius:12px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);
  font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;font-variant-numeric:tabular-nums}
.holes button[aria-pressed="true"]{background:var(--go);color:#fff;box-shadow:none}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding-bottom:28px;align-items:start}
.mapcard{padding:8px;position:sticky;top:132px}
#map{height:calc(100svh - 200px);min-height:420px;border-radius:16px;background:#26302a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 4px;font-size:14px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{flex:0 0 auto;width:14px;height:14px;border-radius:4px;display:inline-block}
.sw.mow{background:var(--mow)} .sw.grow{background:var(--grow)} .sw.surr{background:var(--surr)}
.sw.seed{background:repeating-linear-gradient(45deg,var(--seed) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--seed)}
.side{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.back{align-self:flex-start;border:0;background:none;padding:0;color:var(--tank-deep);font-weight:700;cursor:pointer}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.side h2{font-size:32px}
.lede{margin:0;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r2);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.prog .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.prog .big small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);margin-left:6px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--go),#6ff0a6);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.rules .sw{margin-top:4px}
.report{margin:0;padding:12px 14px;border-radius:var(--r2);background:var(--go-soft);box-shadow:inset 0 0 0 1px rgba(19,163,86,.3);font-size:15px}
.report b{font-weight:700}
.list{display:flex;flex-direction:column}
.rowb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.rowb:hover{background:var(--chip)}
.rowb .tag{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#13201acc;color:#fff;font-family:var(--display);font-weight:700;font-size:16px;box-shadow:0 0 0 1.5px #fff inset}
.rowb .nm{display:flex;flex-direction:column;min-width:0;font-weight:700}
.rowb .nm small{font-weight:500;color:var(--muted);font-size:13px}
.rowb .nm small.ok{color:var(--go);font-weight:700}
.rowb .ar{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--faint);font-size:20px}
.grp{margin:10px 0 2px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.pic{margin:0;display:flex;flex-direction:column;gap:6px}
.pic canvas{display:block;width:100%;border-radius:14px;background:#26302a}
.pic figcaption{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.fact{padding:9px 11px;border-radius:12px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;min-width:0}
.fact .k{font-size:12px;color:var(--muted);font-weight:600}
.fact .v{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact .v small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:2px}
.note{margin:0;padding:12px 14px;border-radius:var(--r2);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);white-space:pre-wrap}
.desc{margin:0;font-size:16px;font-weight:600}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.hist li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.leaflet-container{font-family:var(--body);background:#26302a}
.leaflet-tooltip.tip{background:#0b2231;color:#fff;border:0;font-weight:700;box-shadow:0 4px 14px #0006}
.leaflet-tooltip-top.tip::before{border-top-color:#0b2231}
.htag{display:grid;place-items:center;border-radius:50%;background:#13201acc;color:#fff;border:1.5px solid #fff;font-family:var(--display);font-weight:700;font-size:13px;line-height:1}
.tick{display:grid;place-items:center;border-radius:50%;background:#fff;color:#13a356;border:2px solid #13a356;font-weight:800;font-size:13px;box-shadow:0 1px 4px #0006}
.foot{margin:0;color:var(--faint);font-size:12px}
.loading{padding:30px;text-align:center;color:var(--muted)}
/* v2: tick off from the map, weekly mowing, seeding with mixes */
.tick.sd{color:#fff;background:#1f9d5b;border-color:#fff}
.tick.old{color:#8a6a00;border-color:#e3ad2f}
.acts{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r2);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.acts h3{font-size:22px}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:52px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;cursor:pointer;background:var(--go);color:#fff;box-shadow:0 6px 16px -8px rgba(19,163,86,.8)}
.btn.sd{background:#1f9d5b}
.btn.alt{background:var(--glass-hi);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;min-height:44px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:15px}
.btn:active{transform:scale(.98)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld select,.fld input{font:inherit;font-size:16px;color:var(--fg);background:var(--glass-hi);border:0;border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.calc b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--go)}
.calc span{color:var(--muted);font-size:14px;font-weight:600}
.hint{margin:0;font-size:13px;color:var(--muted)}
.okmsg{margin:0;padding:10px 12px;border-radius:12px;background:var(--go-soft);font-weight:700}
.sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r2);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.sw2 b{display:block}.sw2 small{color:var(--muted)}
.tg{flex:0 0 auto;width:54px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0005;transition:left .2s}
.tg[aria-checked="true"]{background:#1f9d5b}.tg[aria-checked="true"]::after{left:25px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mixrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.mixrow b{font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist .pend{color:var(--warn);font-weight:700;font-size:12px}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who button{border:0;background:none;color:var(--tank-deep);font-weight:700;cursor:pointer;padding:0}
#outbox{background:rgba(255,188,69,.25)}

@media (max-width: 900px){
  .grid{grid-template-columns:1fr}
  .mapcard{position:relative;top:0}
  #map{height:58svh;min-height:340px}
  .top{position:relative}
}
@media (prefers-reduced-motion: reduce){.sky i{animation:none}.meter i{transition:none}}
/* full screen map: the expand button on the map. Tap an area and its card slides up over the map. Back or the button shrinks it. */
.fsbtn{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#13201a;box-shadow:0 2px 10px #0005;display:grid;place-items:center;cursor:pointer;padding:0}
.fsbtn svg{width:22px;height:22px}
body.mapfull{overflow:hidden}
body.mapfull .mapcard,body.mapfull main.grid{-webkit-backdrop-filter:none;backdrop-filter:none}
body.mapfull .top{position:fixed;top:0;left:0;right:0;z-index:1001;padding-bottom:6px;background:var(--bg)}
body.mapfull .top .row1{display:none}
body.mapfull #map{position:fixed!important;left:0;right:0;bottom:0;top:var(--hdr,0px);height:auto;min-height:0;z-index:1000;border-radius:0}
body.mapfull .side{display:none}
body.mapfull.picked .side{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1002;max-height:46svh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="seedHatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#34c77b" fill-opacity="0.28"></rect><rect width="3" height="7" fill="#34c77b" fill-opacity="0.95"></rect>
  </pattern></defs></svg>

<header class="top gut">
  <div class="wrap glass topin">
    <div class="row1">
      <div class="brand"><h1>Rough <span>Plan</span></h1><p>Ranfurlie &middot; summer 2026&ndash;27 &middot; crew view</p></div>
      <span class="pill" id="upd">Loading&hellip;</span>
      <span class="pill" id="outbox" hidden><span></span></span>
    </div>
    <nav class="holes" id="holes" aria-label="Choose a hole"></nav>
  </div>
</header>

<main class="wrap gut grid">
  <section class="glass mapcard" aria-label="Course map">
    <div id="map"></div>
    <div class="legend">
      <span><i class="sw mow"></i>Mow (4300)</span>
      <span><i class="sw surr"></i>Surrounds mower to bunker edge</span>
      <span id="lgGrow"><i class="sw grow"></i>Let grow</span>
      <span><i class="sw seed"></i>Fescue seeding</span>
      <span>✓ mown this week · 🌱 seeded</span>
    </div>
  </section>
  <aside class="glass side" id="side" aria-live="polite"><p class="loading">Loading the plan&hellip;</p></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const TZ = 'Australia/Melbourne';
  const TYPE = {
    mow: { label: 'Mow (4300)', desc: 'One lap of the 4300 at 2.3 m. Mow it.', col: '#2d93e6' },
    surr: { label: 'Surrounds mower', desc: 'Surrounds or fairway mower goes right to the bunker edge. The 4300 stays out.', col: '#b98cff' },
    grow: { label: 'Let grow', desc: 'Do not mow. Left to thin out and go wispy.', col: '#e3ad2f' },
    seed: { label: 'Fescue seeding', desc: 'Bulk fescue seeding behind the bunker. Do not mow.', col: '#34c77b' },
  };
  const LINE = { fairways: '#a8ec9a', approaches: '#d2ec8a', greens: '#4ff08f', tees: '#86dbff', bunkers: '#fff2c4', water: '#63b0ff', other: '#e2e2e2' };
  const CUT = 2.29; // m, Groundsmaster 4300-D width of cut
  const LAT0 = -38.1207, PHI = LAT0 * Math.PI / 180;
  const KX = 111412.84 * Math.cos(PHI) - 93.5 * Math.cos(3 * PHI), KY = 111132.954 - 559.822 * Math.cos(2 * PHI) + 1.175 * Math.cos(4 * PHI);
  const mxy = (c) => [(c[0] - 145.24) * KX, (c[1] - LAT0) * KY];
  const lonlat = (p) => [p[0] / KX + 145.24, p[1] / KY + LAT0];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const narrow = () => matchMedia('(max-width: 900px)').matches;
  const dayKey = (d) => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ });
  const today = dayKey(Date.now());
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-AU', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtWhen = (iso) => {
    const k = dayKey(iso); if (k === today) return 'today ' + fmtTime(iso);
    const days = Math.round((new Date(today) - new Date(k)) / 864e5);
    if (days === 1) return 'yesterday ' + fmtTime(iso);
    return new Date(iso).toLocaleDateString('en-AU', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
  };
  const fmtArea = (m2) => m2 >= 10000 ? [(m2 / 10000).toFixed(2), 'ha'] : [Math.round(m2).toLocaleString('en-AU'), 'm²'];
  const holeLabel = (h) => h === 'other' ? 'Practice & other' : 'Hole ' + h;
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  // ---------- v2: live ticks from the map (Zapier hook -> rough/live.json), weekly mowing, seeding ----------
  const HOOK = 'https://hooks.zapier.com/hooks/catch/18429017/GrEKprgQv0KYjuXL/';
  const TEST = /[?&]test=1/.test(location.search);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem('rough.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('rough.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const DEFAULT_MIXES = [{ name: 'Ranfurlie rough mix', rate: 35, min: 30, max: 40, use: 'Rough and no-mow' }];
  const getLive = () => fetch('live.json?t=' + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  let course, data, live;
  try {
    [course, data, live] = await Promise.all([fetch('course.json').then((r) => r.json()), fetch('data.json?t=' + Date.now()).then((r) => r.json()), getLive()]);
  } catch (e) { $('#side').textContent = 'Couldn’t load the plan. Pull down to refresh.'; return; }
  live = live || { ticks: [], mixes: [], settings: {} };

    for (const a of areas.filter((x) => x.hole === h).sort((x, y) => rank[effType(x)] - rank[effType(y)] || x.name.localeCompare(y.name, 'en', { numeric: true }))) {

  }
  function renderArea(side, a) {

    const et = effType(a);

    const [v, u] = fmtArea(a.area); add('Area', v, u);

    else if (asSeed(a)) { const mx = mixes()[0]; const rate = a.rate ?? (data.seed && data.seed.rate) ?? mx.rate; add('Seed needed', kgFmt(a.area * rate / 1000), 'kg'); const l = lastOf(a.id, 'seed'); add('Seeded', l ? fmtWhen(l.at) : 'Not yet'); if (l && l.kg) add('Used', kgFmt(l.kg), 'kg'); }
    else if (a.type === 'surr') add('Mower', 'Surrounds / fairway'); else add('Mowing', 'None');
    side.append(facts);
    if (a.note) { side.append(el('p', 'eyebrow', 'Notes'), el('p', 'note', a.note)); }
    const hist = ticks.filter((t) => t.area === a.id).slice(0, 12);
    if (hist.length) {
      const ul = el('ul', 'hist');
      for (const t of hist) {
        const li = el('li'); const s = el('span', null, (t.kind === 'seed' ? 'Seeded ' : 'Mown ') + fmtWhen(t.at) + byWho(t) + (t.kind === 'seed' && t.kg ? ' · ' + kgFmt(t.kg) + ' kg' + (t.mix ? ' ' + t.mix : '') : ''));
        li.append(s);
        if (t.pending) li.append(el('span', 'pend', 'sending'));
        else if (/^TK-/.test(t.id || '') && Date.now() - Date.parse(t.at) < 2 * 864e5) { const u = el('button', 'btn alt sm', 'Undo'); u.type = 'button'; u.addEventListener('click', () => undoTick(t)); li.append(u); }
        ul.append(li);
      }
      side.append(el('p', 'eyebrow', 'History'), ul);
    }
    if (a.type === 'mow' || asSeed(a)) side.append(report());
    requestAnimationFrame(() => drawPic(cv, a));
  }

  // ---------- tick-off panel ----------
  let flash = null;
  function actions(a) {
    const box = el('div', 'acts');
    if (flash && flash.area === a.id && Date.now() - flash.t < 15000) box.append(el('p', 'okmsg', flash.msg));
    if (a.type === 'mow') {
      const l = lastOf(a.id, 'mow');
      box.append(el('h3', null, l && thisWeek(l.at) ? 'Mown this week ✓' : 'Mow this area'));
      const b = el('button', 'btn', '✓  Mown (4300 lap)'); b.type = 'button';
      b.addEventListener('click', () => { if (tickArea(a, 'mow')) { flash = { area: a.id, t: Date.now(), msg: 'Ticked off: ' + a.name + ' mown ' + fmtTime(new Date().toISOString()) + '.' }; render(); } });
      box.append(b, whoLine()); return box;
    }
    if (!asSeed(a) && a.type !== 'grow') return null;
    const all = mixes();
    box.append(el('h3', null, a.type === 'grow' && !asSeed(a) ? 'Seed this no-mow area' : 'Log seeding'));
    const fm = el('label', 'fld', 'Seed mix'); const sel = el('select');
    for (const m of all) { const o = el('option', null, m.name); o.value = m.name; sel.append(o); }
    const oo = el('option', null, 'Other mix…'); oo.value = '__other'; sel.append(oo);
    const last = LS.get('mix', ''); if (last && all.some((m) => m.name === last)) sel.value = last;
    fm.append(sel);
    const on = el('label', 'fld', 'Mix name'); const nameIn = el('input'); nameIn.placeholder = 'e.g. Fescue blend B'; on.append(nameIn); on.hidden = true;
    const two = el('div', 'two');
    const fr = el('label', 'fld', 'Rate (kg / 100 m²)'); const rateIn = el('input'); rateIn.type = 'number'; rateIn.inputMode = 'decimal'; rateIn.step = '0.25'; rateIn.min = '0.5'; rateIn.max = '20'; fr.append(rateIn);
    const fa = el('label', 'fld', 'Area seeded (m²)'); const m2In = el('input'); m2In.type = 'number'; m2In.inputMode = 'numeric'; m2In.min = '1'; m2In.value = String(Math.round(a.area)); fa.append(m2In);

    function setRate() { const m = cur(); rateIn.value = m ? String(m.rate / 10) : rateIn.value || '3.5'; hint.textContent = m && m.min && m.max ? m.name + ': ' + m.min / 10 + ' to ' + m.max / 10 + ' kg per 100 m²' + (m.use ? ' · ' + m.use : '') : 'Whole area is ' + Math.round(a.area).toLocaleString('en-AU') + ' m². Change it if you only did part.'; }
    function upd() { const r = Number(rateIn.value) * 10, m2 = Number(m2In.value); const ok = r > 0 && m2 > 0; kgB.textContent = ok ? kgFmt(m2 * r / 1000) + ' kg' : '–'; kgS.textContent = ok ? 'of seed for ' + Math.round(m2).toLocaleString('en-AU') + ' m² at ' + rateIn.value + ' kg/100 m²' : 'Enter a rate and area'; }
    sel.addEventListener('change', () => { on.hidden = sel.value !== '__other'; if (sel.value !== '__other') setRate(); upd(); });
    rateIn.addEventListener('input', upd); m2In.addEventListener('input', upd);
    setRate(); upd();
    const b = el('button', 'btn sd', '🌱  Seeded'); b.type = 'button';
    b.addEventListener('click', () => {
      const other = sel.value === '__other'; const mix = other ? nameIn.value.trim().slice(0, 50) : sel.value; const r = Number(rateIn.value) * 10, m2 = Math.round(Number(m2In.value));
      if (!mix) { alert('Name the seed mix.'); return; } if (!(r >= 5 && r <= 200)) { alert('Check the rate (kg per 100 m²).'); return; } if (!(m2 > 0 && m2 <= 60000)) { alert('Check the area.'); return; }
      const kg = Math.round(m2 * r / 100) / 10;
      if (other) send({ kind: 'mix', mix, rate: r, by: myName() || askName() || 'Someone' });
      if (tickArea(a, 'seed', { mix, rate: r, m2, kg, part: m2 < a.area * 0.95 ? '1' : '' })) { LS.set('mix', mix); flash = { area: a.id, t: Date.now(), msg: 'Logged: ' + kgFmt(kg) + ' kg of ' + mix + ' on ' + a.name + '.' }; render(); }
    });
    box.append(fm, on, two, calc, hint, b, whoLine());
    return box;
  }

  // ---------- area picture ----------
  const imgs = {}; const imgOf = (src) => { if (!imgs[src]) { const im = imgs[src] = new Image(); im.onload = () => { if (state.area) { const cv = $('#side canvas'); if (cv) drawPic(cv, byId[state.area]); } }; im.src = src; } return imgs[src].complete && imgs[src].naturalWidth ? imgs[src] : null; };
  let hatch = null;
  function drawPic(cv, a) {
    const cw = Math.max(220, cv.parentNode.clientWidth || 340);
    let [x0, y0] = mxy([a.bb[0], a.bb[1]]), [x1, y1] = mxy([a.bb[2], a.bb[3]]);
    const pad = Math.max(12, .18 * Math.max(x1 - x0, y1 - y0)); x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const ch = Math.min(Math.max(Math.round(cw * (y1 - y0) / (x1 - x0)), Math.round(cw * .56)), Math.round(cw * 1.05));
    const want = ch / cw, have = (y1 - y0) / (x1 - x0);
    if (have < want) { const d = ((x1 - x0) * want - (y1 - y0)) / 2; y0 -= d; y1 += d; } else { const d = ((y1 - y0) / want - (x1 - x0)) / 2; x0 -= d; x1 += d; }
    const dpr = Math.min(devicePixelRatio || 1, 2.5); cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); cv.style.height = ch + 'px';
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (im) {
      const tl = lonlat([x0, y1]), br = lonlat([x1, y0]);
      const ix0 = (tl[0] - W0) / (E0 - W0) * im.naturalWidth, iy0 = (N0 - tl[1]) / (N0 - S0) * im.naturalHeight;
      const ix1 = (br[0] - W0) / (E0 - W0) * im.naturalWidth, iy1 = (N0 - br[1]) / (N0 - S0) * im.naturalHeight;

      for (const rings of ps) for (const r of rings) { r.forEach((c, i) => { const p = mxy(c); i ? ctx.lineTo(X(p), Y(p)) : ctx.moveTo(X(p), Y(p)); }); ctx.closePath(); } };
    if (!hatch) { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.fillStyle = 'rgba(52,199,123,.3)'; x.fillRect(0, 0, 8, 8);
      x.strokeStyle = 'rgba(52,199,123,.95)'; x.lineWidth = 3; x.beginPath(); x.moveTo(-2, 10); x.lineTo(10, -2); x.moveTo(-2, 2); x.lineTo(2, -2); x.moveTo(6, 10); x.lineTo(10, 6); x.stroke(); hatch = ctx.createPattern(c, 'repeat'); }
    const al = { grow: .26, surr: .5, mow: .42, seed: .55 };
    for (const o of areas.slice().sort((p, q) => order[p.type] - order[q.type])) {
      if (o.id === a.id || !hit(o.bb, vb)) continue; trace(o.g); ctx.globalAlpha = al[o.type]; ctx.fillStyle = o.type === 'seed' ? hatch : TYPE[o.type].col; ctx.fill('evenodd'); ctx.globalAlpha = 1;
    }
    for (const f of course.features) { const bb = f.bb || (f.bb = bboxOf(f.g)); if (!hit(bb, vb)) continue; trace(f.g);
      if (f.l === 'bunkers') { ctx.fillStyle = 'rgba(255,242,196,.5)'; ctx.fill('evenodd'); } ctx.strokeStyle = LINE[f.l] || LINE.other; ctx.lineWidth = f.l === 'bunkers' ? 1 : 1.3; ctx.stroke(); }
    trace(a.g); ctx.fillStyle = a.type === 'seed' ? hatch : TYPE[a.type].col; ctx.globalAlpha = a.type === 'seed' ? 1 : .62; ctx.fill('evenodd'); ctx.globalAlpha = 1;
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.stroke(); ctx.strokeStyle = TYPE[a.type].col; ctx.lineWidth = 2; ctx.stroke();
    const span = (x1 - x0) * .3, nice = [2, 5, 10, 20, 50, 100, 200].filter((n) => n <= span).pop() || 2, Lp = nice * k;
    ctx.fillStyle = 'rgba(19,32,26,.72)'; ctx.fillRect(8, ch - 28, Lp + 16, 20); ctx.fillStyle = '#fff'; ctx.fillRect(16, ch - 15, Lp, 3); ctx.fillRect(16, ch - 20, 2, 8); ctx.fillRect(16 + Lp - 2, ch - 20, 2, 8);
    ctx.font = '600 11px Barlow, system-ui, sans-serif'; ctx.textBaseline = 'bottom'; ctx.fillText(nice + ' m', 22, ch - 16);
    ctx.fillStyle = 'rgba(19,32,26,.72)'; ctx.beginPath(); ctx.arc(cw - 18, 18, 11, 0, 2 * Math.PI); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('N', cw - 18, 19); ctx.textAlign = 'start';
  }
  let rT = null; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const cv = $('#side canvas'); if (cv && state.area) drawPic(cv, byId[state.area]); }, 150); });

  // start from the link: #hole-5 or #<area id>
  const hsh = location.hash.slice(1);
  if (hsh.startsWith('hole-') && holes.includes(hsh.slice(5))) go({ hole: hsh.slice(5) }, false, true);
  else if (byId[hsh]) go({ area: hsh });
  else go({});
})();
