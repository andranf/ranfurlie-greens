<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranfurlie Course Ops</title>
<meta name="description" content="Irrigation, drainage, bunkers, topdressing and grounds at Ranfurlie in one place: open jobs, maps, stock and stocktakes, bunker sand and live Turfco loads.">
<meta name="theme-color" content="#e4f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06121b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2313a356'/%3E%3Cpath d='M22 50V14l20 8-20 8' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Ranfurlie Course Ops v1.0 (24 Oct 2026). One page for irrigation, drainage, bunkers, topdressing and grounds.
   Reads each area's data.json (rebuilt hourly from Slack + Notion) plus ops/live.json (written straight away by the
   Zapier "Ops dashboard actions" hook whenever someone does a stocktake, adds sand or taps a Turfco load here).
   Design: the tank-mix glass system. Each area has its own colour so it's obvious which one you're in. */
:root{
  color-scheme:light;
  --bg:#e8f1f3;
  --glass:rgba(255,255,255,.6); --glass-hi:rgba(255,255,255,.8); --glass-lo:rgba(255,255,255,.36); --glass-solid:rgba(247,251,252,.96);
  --rim:rgba(255,255,255,.92); --rim2:rgba(255,255,255,.38); --edge:rgba(16,52,72,.10);
  --shadow:0 18px 40px -20px rgba(14,52,76,.35),0 2px 6px -2px rgba(14,52,76,.12);
  --fg:#0b2231; --muted:#3f5d6e; --faint:#6f8a99; --line:rgba(16,52,72,.12);
  --hi:#e0313b; --hi-bg:rgba(224,49,59,.12); --med:#b86a00; --med-bg:rgba(255,176,32,.2); --lo:#4f6a7a; --lo-bg:rgba(79,106,122,.12);
  --ok:#13a356; --ok-bg:rgba(19,163,86,.14);
  --scrim:rgba(8,30,44,.4);
  --turf:#d9e6d2; --fair:#bdd8b2; --appr:#a5cfa6; --tee:#8fc29a; --green:#5fae73; --sand:#d8bf82; --sand-edge:#6f8a5c; --water:#0573a8; --pipe:#b8651d; --pit:#8a6a12; --ag:#3f7f6c; --holeTxt:#0b2231; --map-bg1:#eef6fa; --map-bg2:#e4f1f7; --map-edge:#e4f1f7; --lo-map:#4e6aa8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:24px; --r2:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#06121b;
  --glass:rgba(18,40,56,.54); --glass-hi:rgba(28,58,78,.68); --glass-lo:rgba(18,40,56,.34); --glass-solid:rgba(13,31,44,.97);
  --rim:rgba(255,255,255,.2); --rim2:rgba(255,255,255,.06); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.4);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.1);
  --hi:#ff6b6b; --hi-bg:rgba(255,107,107,.16); --med:#ffbc45; --med-bg:rgba(255,188,69,.15); --lo:#a9c4d2; --lo-bg:rgba(169,196,210,.12);
  --ok:#2fd27a; --ok-bg:rgba(47,210,122,.16);
  --scrim:rgba(0,0,0,.6);
  --turf:#1b3524; --fair:#22472f; --appr:#295a3b; --tee:#2d6845; --green:#3f915f; --sand:#a8925f; --sand-edge:#0d120c; --water:#38c6ff; --pipe:#e39a52; --pit:#f2d27a; --ag:#7fb3a3; --holeTxt:#f1f8fb; --map-bg1:#0b1d2a; --map-bg2:#06121b; --map-edge:#06121b; --lo-map:#93a9d6;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#06121b;
  --glass:rgba(18,40,56,.54); --glass-hi:rgba(28,58,78,.68); --glass-lo:rgba(18,40,56,.34); --glass-solid:rgba(13,31,44,.97);
  --rim:rgba(255,255,255,.2); --rim2:rgba(255,255,255,.06); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.4);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.1);
  --hi:#ff6b6b; --hi-bg:rgba(255,107,107,.16); --med:#ffbc45; --med-bg:rgba(255,188,69,.15); --lo:#a9c4d2; --lo-bg:rgba(169,196,210,.12);
  --ok:#2fd27a; --ok-bg:rgba(47,210,122,.16);
  --scrim:rgba(0,0,0,.6);
  --turf:#1b3524; --fair:#22472f; --appr:#295a3b; --tee:#2d6845; --green:#3f915f; --sand:#a8925f; --sand-edge:#0d120c; --water:#38c6ff; --pipe:#e39a52; --pit:#f2d27a; --ag:#7fb3a3; --holeTxt:#f1f8fb; --map-bg1:#0b1d2a; --map-bg2:#06121b; --map-edge:#06121b; --lo-map:#93a9d6;
}

/* one colour per area: light value, dark value */
body{--accL:#0a7fd0;--accD:#4cc2ff;--deepL:#05589a;--deepD:#a6e0ff}
body[data-area="irrigation"]{--accL:#0a7fd0;--accD:#4cc2ff;--deepL:#05589a;--deepD:#a6e0ff}
body[data-area="drainage"]{--accL:#6a46f5;--accD:#a68dff;--deepL:#4527c2;--deepD:#d2c6ff}
body[data-area="bunkers"]{--accL:#c27a06;--accD:#f5bd4c;--deepL:#7f4f00;--deepD:#ffe0a1}
body[data-area="topdressing"]{--accL:#dc5222;--accD:#ff8f62;--deepL:#9b3412;--deepD:#ffc3ab}
body[data-area="grounds"]{--accL:#169552;--accD:#3ddc8a;--deepL:#0c6a3a;--deepD:#a5f0c8}
body[data-area="keys"]{--accL:#c8336b;--accD:#ff7aa8;--deepL:#8f1d48;--deepD:#ffc2d6}
body{--acc:var(--accL);--acc-deep:var(--deepL);--acc-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--acc:var(--accD);--acc-deep:var(--deepD);--acc-ink:#03141d}}
:root[data-theme="dark"] body{--acc:var(--accD);--acc-deep:var(--deepD);--acc-ink:#03141d}
body{--acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);--acc-line:color-mix(in srgb,var(--acc) 40%,transparent)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.02;letter-spacing:.01em}
a{color:var(--acc-deep)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}

/* the sky behind the glass, tinted to the area */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.sky i{position:absolute;border-radius:50%;filter:blur(10px);opacity:.8;transition:background 1s var(--ease)}
.sky i:nth-child(1){width:85vmax;height:85vmax;left:-32vmax;top:-38vmax;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 55%,transparent) 0,transparent 62%);animation:drift1 40s ease-in-out infinite alternate}
.sky i:nth-child(2){width:70vmax;height:70vmax;right:-32vmax;top:22vh;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,#86e8b4 30%) 0,transparent 62%);animation:drift2 46s ease-in-out infinite alternate}
.sky i:nth-child(3){width:60vmax;height:60vmax;left:-12vmax;bottom:-32vmax;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,#ffe08a 30%) 0,transparent 60%);opacity:.5;animation:drift1 54s ease-in-out infinite alternate-reverse}
.sky i:nth-child(4){width:50vmax;height:50vmax;right:-18vmax;bottom:-24vmax;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent) 0,transparent 62%);opacity:.45;animation:drift2 48s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(1.1)}}
@media (prefers-reduced-motion: reduce){.sky i{animation:none}*{scroll-behavior:auto!important}}

/* glass recipe */
.card,.tabs .bar,.toast,.sheet .panel,.seg{
  background:linear-gradient(180deg,var(--glass-hi),var(--glass) 40%,var(--glass));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2),inset 0 -1px 0 var(--edge),var(--shadow);
}
.card{border-radius:var(--r);padding:18px;min-width:0}
@media (min-width:640px){.card{padding:22px}}
.card h2{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .count{font-size:16px;font-weight:700;color:var(--acc-deep);background:var(--acc-soft);border-radius:99px;padding:2px 10px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--muted);font-size:15px}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}

/* header */
.top .wrap{padding-block:16px 6px;display:grid;gap:6px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:clamp(34px,8vw,48px);display:flex;align-items:center;gap:12px}
.top h1 .dot{width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px var(--acc-soft)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.fact.acc{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.testbar{background:var(--med-bg);color:var(--med);font-weight:600;text-align:center;padding:6px 12px;font-size:14px}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:6px}
.tabs .bar{max-width:1180px;margin:0 auto;border-radius:20px;padding:6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .bar::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:0;border:0;background:transparent;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);white-space:nowrap;transition:background .25s var(--ease),color .25s}
.tab i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.tab b{font-size:13px;min-width:22px;padding:0 6px;border-radius:99px;background:var(--glass-lo);color:var(--fg);line-height:20px;text-align:center}
.tab[aria-selected="true"]{background:var(--c);color:#fff}
.tab[aria-selected="true"] b{background:rgba(255,255,255,.25);color:#fff}
@media (max-width:620px){.tabs .bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:5px}.tab{flex-direction:column;gap:3px;padding:7px 1px 6px;font-size:clamp(12px,3.3vw,16px);letter-spacing:0}.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis}.tab b{position:absolute;margin:-4px 0 0 30px;font-size:11px;min-width:18px;line-height:17px;padding:0 4px}.tab{position:relative}.tab i{width:11px;height:11px}}

/* layout */
main .wrap{display:grid;gap:16px;padding-block:10px 120px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:16px;min-width:0}
.in{animation:inUp .4s var(--ease) both}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}}

/* KPI tiles with a little chart inside (house style) */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border-radius:18px;padding:12px 14px 10px;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);display:grid;gap:2px;min-width:0}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:17px;font-weight:700;color:var(--muted);margin-left:3px}
.tile .viz{height:26px;margin-top:4px}
.tile .viz svg{width:100%;height:26px;display:block}
.tile.acc .v{color:var(--acc-deep)}
.tile.hi .v{color:var(--hi)}

/* buttons */
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);min-height:46px;text-decoration:none;color:var(--fg);transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 24px -12px var(--acc)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--acc-line);color:var(--acc-deep)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:99px;padding:7px 13px;font-weight:600;font-size:15px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--line);min-height:38px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.chip.sm{min-height:30px;padding:4px 10px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.tag.High{background:var(--hi-bg);color:var(--hi)} .tag.Medium{background:var(--med-bg);color:var(--med)} .tag.Low{background:var(--lo-bg);color:var(--lo)}
.tag.st{background:var(--acc-soft);color:var(--acc-deep)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}

/* jobs */
.jobs{display:grid;gap:2px}
.job{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:11px 4px;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.job .pd{width:12px;height:12px;border-radius:50%;margin-top:6px}
.pd.High{background:var(--hi)} .pd.Medium{background:var(--med)} .pd.Low{background:var(--lo)}
.job .t{font-weight:600;line-height:1.3}
.job .m{color:var(--muted);font-size:14px;grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.job .go{font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;padding:4px 8px;border-radius:10px;background:var(--acc-soft);color:var(--acc-deep)}
.job.sel{background:var(--acc-soft);border-radius:14px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--acc-deep);list-style:none;padding:8px 4px}
details.more summary::-webkit-details-marker{display:none}
.empty{color:var(--muted);padding:10px 4px}

/* map */
.map{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 40% 40%,var(--map-bg1),var(--map-bg2));touch-action:none;user-select:none;-webkit-user-select:none;aspect-ratio:960/680;box-shadow:inset 0 0 0 1px var(--line)}
.map svg{width:100%;height:100%;display:block}
.map .ctl{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.map .ctl button{width:38px;height:38px;border-radius:12px;border:0;background:var(--glass-solid);box-shadow:var(--shadow);font-size:20px;font-weight:700;display:grid;place-items:center}
.map .hint{position:absolute;left:10px;bottom:8px;font-size:13px;font-weight:600;background:var(--glass-solid);border-radius:10px;padding:3px 9px;color:var(--muted);pointer-events:none}
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mapbar select{border-radius:12px;border:0;padding:8px 10px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;min-height:40px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted);margin-top:8px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
svg .water{fill:var(--water);fill-opacity:.22;stroke:var(--water);stroke-opacity:.5;stroke-width:.8}
svg .p-fairway,svg .p-approach,svg .p-tee{stroke:var(--map-edge);stroke-width:.6}
svg .p-fairway{fill:var(--fair)} svg .p-approach{fill:var(--appr)} svg .p-tee{fill:var(--tee)} svg .p-green{fill:var(--green);stroke:var(--map-edge);stroke-width:1.2}
svg .p-bunker{fill:var(--sand);stroke:var(--map-edge);stroke-width:.6}
svg .bk{fill:var(--sand);stroke:var(--sand-edge);stroke-width:.8;cursor:pointer;transition:fill .2s}
svg .bk.job.High{fill:var(--hi)} svg .bk.job.Medium{fill:var(--med)} svg .bk.job.Low{fill:var(--lo-map)}
svg .bk.recent{stroke:var(--ok);stroke-width:2.4;vector-effect:non-scaling-stroke}
svg .bk.sel{fill:var(--acc);stroke:var(--fg);stroke-width:2;vector-effect:non-scaling-stroke}
svg .bkhit{fill:transparent;stroke:transparent;stroke-width:14;cursor:pointer;vector-effect:non-scaling-stroke}
svg .hn{font-family:var(--display);font-weight:700;fill:var(--holeTxt);opacity:.55;pointer-events:none;text-anchor:middle}
svg .bn{font-family:var(--display);font-weight:700;fill:var(--fg);pointer-events:none;text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .2s;paint-order:stroke;stroke:var(--map-edge);stroke-linejoin:round}
svg .pin{stroke:var(--map-edge);stroke-width:1.5;cursor:pointer;vector-effect:non-scaling-stroke}
svg .pin.High{fill:var(--hi)} svg .pin.Medium{fill:var(--med)} svg .pin.Low{fill:var(--lo-map)}
svg .pin.sel{stroke:var(--fg);stroke-width:2.5}
svg .pring{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ripple 2.6s ease-out infinite;pointer-events:none}
svg .pring.High{stroke:var(--hi)} svg .pring.Medium{stroke:var(--med)} svg .pring.Low{stroke:var(--lo-map)}
svg .est{fill:none;stroke-width:1.8;stroke-dasharray:2.5 2;vector-effect:non-scaling-stroke;pointer-events:none}
svg .halo{pointer-events:none}
@keyframes ripple{0%{transform:scale(.6);opacity:.95}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion: reduce){svg .pring{animation:none;opacity:0}}
svg .pipe-u{fill:none;stroke:var(--map-edge);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.7}
svg .pipe{fill:none;stroke:var(--pipe);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .agl{fill:none;stroke:var(--ag);stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;opacity:.75}
svg .pit{fill:var(--map-edge);stroke:var(--pit);stroke-width:1.6;vector-effect:non-scaling-stroke}
svg .pit.hot{fill:var(--hi);stroke:var(--hi)}
svg .outf{fill:var(--water);stroke:var(--map-edge);stroke-width:1.2;vector-effect:non-scaling-stroke}
svg .outf.hot{stroke:var(--hi);stroke-width:2.4}
svg .gdone{fill:var(--acc)}
svg .glabel{font-family:var(--display);font-weight:800;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}

/* stock */
.stock{display:grid;gap:0}

<script>

/* ------------------------------------------------------------------ config */
const HOOK = "https://hooks.zapier.com/hooks/catch/18429017/R9IHP2aX1ajxyU3o/";

const AREAS = {
  map:{label:"Map",c:"#0aa6dc"},
  irrigation:{label:"Irrigation",long:"",c:"#0a7fd0",data:"../irrigation/data.json",full:"../irrigation/",ch:"C06HV77DBQV",chName:"#irrigation",pfx:"IRR"},
  drainage:{label:"Drainage",c:"#6a46f5",data:"../drainage/data.json",full:"../drainage/",ch:"C0B885SR474",chName:"#drainage",pfx:"DRN"},

};

/* Shed key register lives on the Ranfurlie Safety site (keys.html + its Apps Script register) */
const KEYS_API = "https://script.google.com/macros/s/AKfycbyqLHwwPqJumh5_J5VXVVeTZvoJ8onW6vO9BWHVRu4owCzTT09riW7mKt0wkghRIpKj/exec";
const KEYS_PAGE = "https://andranf.github.io/ranfurlie-safety/keys.html";
const GROUNDS = {amstel:{label:"Amstel",c:"#169552",ch:"C06G6PGEJ80",chName:"#amstelgrounds",area:"amstel"},clubhouse:{label:"Clubhouse",c:"#4b6fe0",ch:"C06FWKZN5BK",chName:"#ranfurlieclubhouse",area:"clubhouse"},sand:{label:"Sand counter",c:"#b5841a",ch:"C087R8YRB28",chName:"#sandcounter",area:"sand"}};
const OPEN = ["Open","In progress","Waiting on parts","Waiting on materials"];
const PR = {High:0,Medium:1,Low:2};
const STD = {
  irrigation:[["752 head",""],["751 head",""],["700 head",""],["900 head",""],["950 head",""],["952 head",""],["Case",""],["Drive case",""],["Green nozzle",""],["Nozzle",""],["Coil",""],["Solenoid",""],["Pilot valve",""],["Decoder",""],["Clip",""],["1 inch adapter",""],["ACME/BSP adapter",""],["DBR/Y connector",""],["Screw cap",""],["Heat shrink cap",""]],
  drainage:[["Slotted pipe 100mm","m"],["Slotted pipe 50mm","m"],["PVC pipe 100mm","lengths"],["PVC pipe 90mm","lengths"],["Junction","each"],["Elbow","each"],["End cap","each"],["Pit/riser","each"],["Grate","each"],["Geofabric","m"],["Drainage rock","t"],["Drainage sand","t"],["PVC glue/primer","each"]],
  bunkers:[["Medium top","t"],["Black sand","t"],["Bunker matting","rolls"],["Turf","m2"],["Ag pipe","m"],["Gravel","t"],["Sump pit","each"],["Pins/staples","bags"],["Wetting agent","each"]]
};

const SAND_UNITS = ["buckets","gator loads","t","trailer loads","bags"];
const TEST = new URLSearchParams(location.search).get("test") === "1";

/* ------------------------------------------------------------------ state */
const S = {data:{}, live:null, tab:"irrigation", sub:"amstel", sel:{}, views:{}, tdKey:null, mapApi:{}};
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {get(k,d){try{const v=localStorage.getItem("ops."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ops."+k,JSON.stringify(v))}catch(e){}}};
const fmt = n => n==null||isNaN(n) ? "?" : String(Math.round(n*100)/100);
const uid = p => p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function melYmd(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Melbourne",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function melTime(d){return new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Melbourne",hour:"numeric",minute:"2-digit",hour12:true}).format(d).replace(/\s+/g,"").toLowerCase()}
function dayLabel(ymd){if(!ymd)return"";const [y,m,d]=ymd.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,2));return new Intl.DateTimeFormat("en-AU",{weekday:"short",timeZone:"UTC"}).format(dt)+" "+d+" "+MON[m-1]}
function shortDate(ymd){if(!ymd)return"";const [y,m,d]=ymd.slice(0,10).split("-").map(Number);return d+" "+MON[m-1]}
function today(){return melYmd(new Date())}
function daysAgo(ymd){if(!ymd)return null;const a=Date.parse(ymd.slice(0,10)+"T00:00:00Z"),b=Date.parse(today()+"T00:00:00Z");return Math.round((b-a)/86400000)}
function ago(iso){const m=Math.round((Date.now()-Date.parse(iso))/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" d ago"}
function genUtc(gen){ // data.json "generated" is Melbourne local time without an offset
  if(!gen)return 0;const m=Number(gen.slice(5,7));const off=(m>=10||m<=3)?"+11:00":"+10:00";return Date.parse(gen+":00"+off)||0}
function name(){return LS.get("name","")}

/* ------------------------------------------------------------------ outbox: queued posts to the Zapier hook, kept until sent */
function outbox(){return LS.get("outbox",[])}
function setOutbox(a){LS.set("outbox",a);showOutbox()}
function send(payload){
  payload.sent_at=new Date().toISOString();
  if(TEST){payload.__test="1";payload.__quiet="1"}
  const a=outbox();a.push(payload);setOutbox(a);flush();
}
let flushing=false;
function flush(){
  if(flushing||!HOOK||HOOK.indexOf("hooks.zapier.com")<0)return;const a=outbox();if(!a.length)return;flushing=true;const item=a[0];
  const body=new URLSearchParams();Object.keys(item).forEach(k=>{const v=item[k];body.append(k,v==null?"":(typeof v==="object"?JSON.stringify(v):String(v)))});
  fetch(HOOK,{method:"POST",mode:"no-cors",body}).then(()=>{const b=outbox();b.shift();setOutbox(b);flushing=false;flush()},()=>{flushing=false;showOutbox()});
}
function showOutbox(){const n=outbox().length;const el=$("#outbox");el.hidden=!n;if(n)$("span",el).textContent=n+" waiting to send"}
window.addEventListener("online",flush);setInterval(flush,15000);

/* pending: what this phone has done that live.json doesn't show yet */
function pending(){return LS.get("pending",[]).filter(p=>Date.now()-Date.parse(p.at)<3*3600000)}
function addPending(p){const a=pending();a.push(p);LS.set("pending",a)}
function prunePending(){
  const L=S.live;if(!L)return;const ids=new Set((L.events||[]).map(e=>e.id));
  const loads=new Set();const jobs=new Set();(L.td?.jobs||[]).forEach(j=>{jobs.add(j.key);(j.loads||[]).forEach(l=>loads.add(l.key))});
  const keep=pending().filter(p=>{
    if(p.kind==="td_start")return !jobs.has(p.key);
    if(p.kind==="td_load")return !loads.has(p.load_key)&&!p.undone;
    if(p.kind==="td_undo")return loads.has(p.load_key);
    if(p.kind==="td_done"){const j=(L.td?.jobs||[]).find(x=>x.key===p.key);return !(j&&j.finished)}
    if(p.kind==="td_greens"){return Date.parse(L.updated||0)<Date.parse(p.at)}
    return !ids.has(p.id);
  });
  LS.set("pending",keep);
}

/* ------------------------------------------------------------------ data */
async function getJSON(url){const r=await fetch(url+(url.includes("?")?"&":"?")+"v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}

function flipData(d){

  (d.bunkers||[]).forEach(b=>{fp(b.c);(b.p||[]).forEach(fr)});(d.pins||[]).forEach(fxy);fp(d.chip);

async function loadAll(){

}

/* ------------------------------------------------------------------ stock, normalised, with live counts laid over */
function stockOf(area){
  const d=S.data[area==="topdressing"||GROUNDS[area]?"grounds":area];const L=S.live||{};let items=[];
  if(area==="irrigation")items=(d?.stock||[]).map(s=>({name:s.part,unit:"",on:s.onHand,last:s.last,flag:s.toOrder?"to order":s.ordered?"ordered":""}));
  else if(area==="drainage"||area==="bunkers")items=(d?.stock||[]).map(s=>({name:s.mat,unit:s.unit||"",on:s.onHand,last:s.last,flag:s.toOrder?"to order":s.ordered?"ordered":""}));
  else{const ch=area==="topdressing"?"sand":area;items=(d?.stock||[]).filter(s=>(s.ch||[]).includes(ch)&&!/setup test/i.test(s.item)).map(s=>({name:s.item,unit:s.unit||"",on:s.on_hand,last:s.counted||s.moved,sid:s.id,flag:s.low?"low":"",reorder:s.reorder}));
    if(area==="topdressing"||area==="sand"){/* new sand rows made from this page */Object.entries(L.stock||{}).forEach(([n,v])=>{if(!items.some(i=>i.name===n))items.push({name:n,unit:v.unit||"",on:v.on_hand,last:(v.at||"").slice(0,10),sid:v.sid})})}}
  const gen=genUtc(d?.generated);
  // counts and deliveries made since the data was built
  const evArea=area;
  (L.events||[]).filter(e=>(e.kind==="stocktake"||e.kind==="stock_in")&&e.area===evArea&&(!e.test||TEST)&&Date.parse(e.at)>gen).forEach(e=>{
    (e.items||[]).forEach(it=>{let i=items.find(x=>x.name.toLowerCase()===String(it.name).toLowerCase()&&(!x.unit||!it.unit||x.unit===it.unit));if(!i){i={name:it.name,unit:it.unit||"",on:null};items.push(i)}if(it.after!=null)i.on=it.after;i.last=e.at.slice(0,10);i.live=true})});
  if(area==="topdressing"||GROUNDS[area]){Object.entries(L.stock||{}).forEach(([n,v])=>{const i=items.find(x=>x.name===n);if(i&&Date.parse(v.at)>gen){i.on=v.on_hand;i.live=true}})}
  pending().filter(p=>(p.kind==="stocktake"||p.kind==="stock_in")&&p.area===evArea).forEach(p=>{(p.items||[]).forEach(it=>{let i=items.find(x=>x.name.toLowerCase()===it.name.toLowerCase());if(!i){i={name:it.name,unit:it.unit||"",on:null};items.push(i)}i.on=p.kind==="stocktake"?Number(it.counted):(i.on==null?Number(it.counted):i.on+Number(it.counted));i.pend=true})});
  if(area==="topdressing")pending().filter(p=>p.kind==="td_load").forEach(p=>{const i=items.find(x=>x.name===p.sand);if(i&&i.on!=null&&!i.pend)i.on=Math.round((i.on-Number(p.t))*100)/100});
  return items.sort((a,b)=>(a.on==null)-(b.on==null)||a.name.localeCompare(b.name));
}

/* ------------------------------------------------------------------ TOPDRESSING */
function tdJobs(){
  const L=S.live||{};let jobs=(L.td?.jobs||[]).map(j=>({...j,loads:(j.loads||[]).slice(),greens:(j.greens||[]).slice()})).filter(j=>TEST||!(j.test||j.status==="Test"));
  const pend=pending();
  pend.filter(p=>p.kind==="td_start").forEach(p=>{if(!jobs.some(j=>j.key===p.key))jobs.push({key:p.key,id:"TD",date:p.at?melYmd(new Date(p.at)):today(),area:p.area,holes:p.holes,sand:p.sand,load_t:Number(p.load_t),status:"In progress",started:p.at,by:p.by,loads:[],greens:[],pend:true})});
  pend.filter(p=>p.kind==="td_load"&&!p.undone).forEach(p=>{const j=jobs.find(x=>x.key===p.key);if(j&&!j.loads.some(l=>l.key===p.load_key))j.loads.push({key:p.load_key,at:p.at,by:p.by,t:Number(p.t),pend:true})});
  pend.filter(p=>p.kind==="td_undo").forEach(p=>{const j=jobs.find(x=>x.key===p.key);if(j)j.loads=j.loads.filter(l=>l.key!==p.load_key)});
  pend.filter(p=>p.kind==="td_greens").forEach(p=>{const j=jobs.find(x=>x.key===p.key);if(j)j.greens=JSON.parse(p.greens||"[]")});
  pend.filter(p=>p.kind==="td_done").forEach(p=>{const j=jobs.find(x=>x.key===p.key);if(j){j.status="Done";j.finished=p.at;j.done_by=p.by;j.pendDone=true}});
  jobs.forEach(j=>{j.loads.sort((a,b)=>a.at.localeCompare(b.at));j.t=Math.round(j.loads.reduce((a,l)=>a+(Number(l.t)||0),0)*100)/100});
  return jobs.sort((a,b)=>String(b.started).localeCompare(String(a.started)));
}
function viewTopdressing(){
  const jobs=tdJobs();const L=S.live||{};const call=L.td?.call&&L.td.call.date===today()?L.td.call:null;
  const active=jobs.filter(j=>j.status==="In progress");if(!active.find(j=>j.key===S.tdKey))S.tdKey=active[0]?.key||null;const job=active.find(j=>j.key===S.tdKey);
  const done=jobs.filter(j=>j.status==="Done");const t7=done.concat(active).filter(j=>daysAgo(j.date)!=null&&daysAgo(j.date)<7).reduce((a,j)=>a+j.t,0);const t30=done.concat(active).filter(j=>daysAgo(j.date)!=null&&daysAgo(j.date)<30).reduce((a,j)=>a+j.t,0);
  const sand=stockOf("topdressing");const main=sand.find(s=>/kiln/i.test(s.name))||sand[0];
  // last 21 days, tonnes a day
  const days=[];for(let i=20;i>=0;i--){const dt=new Date(Date.now()-i*86400000);days.push(melYmd(dt))}
  const perDay=days.map(d=>jobs.filter(j=>j.date===d).reduce((a,j)=>a+j.t,0));const callDay=days.map(d=>{const j=jobs.find(x=>x.date===d&&x.call&&x.call.t);return j?j.call.t:(call&&d===today()?call.t:null)});
  const tiles=kpiTiles([{k:"Today's call",v:call&&call.loads?call.loads:"–",u:call&&call.loads?"loads":"",viz:call?`<div class="note" style="line-height:26px">${call.mm?call.mm+" mm":""}${call.t?" · ~"+call.t+" t":""}</div>`:"",cls:"acc"},{k:"Last 7 days",v:fmt(t7),u:"t",viz:spark(perDay.slice(-7))},{k:"Last 30 days",v:fmt(t30),u:"t",viz:spark(perDay)},{k:main?main.name:"Sand on hand",v:main&&main.on!=null?fmt(main.on):"–",u:main&&main.on!=null?main.unit:"",viz:main&&main.on!=null?meter(main.on,Math.max(main.on,20)):`<div class="note" style="line-height:26px">count it below</div>`}]);
  return `${tiles}${active.length>1?`<div class="seg" style="justify-self:start">${active.map(j=>`<button aria-pressed="${j.key===S.tdKey}" data-tdkey="${j.key}" style="--c:var(--acc)">${esc(j.id&&j.id!=="TD"?j.id:"New")} ${esc(j.area)}</button>`).join("")}</div>`:""}

function tdActive(job,call){

  <div class="td-hero"><div class="ring"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="${R}"/><circle class="fg" cx="100" cy="100" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg><div class="ct"><div><div class="big">${n}</div><div class="of">${target?"of ~"+target+" loads":(n===1?"load":"loads")}</div></div></div></div>
  <div class="stack" style="gap:12px"><button class="loadbtn" id="tdLoad">${ICON.load}<span>Another Turfco load<small>${fmt(job.load_t||1)} t of ${esc(job.sand||"sand")}</small></span></button>
  <div class="stats"><div class="stat"><div class="k">Sand so far</div><div class="v">${fmt(job.t)} t</div></div><div class="stat"><div class="k">Last load</div><div class="v" style="font-size:20px"${last?` data-ago="${last.at}"`:""}>${last?ago(last.at):"–"}</div></div><div class="stat"><div class="k">Going</div><div class="v" style="font-size:20px"${job.started?` data-ago="${job.started}" data-trim=" ago"`:""}>${job.started?ago(job.started).replace(" ago",""):"–"}</div></div></div>
  <div class="row">${last?`<button class="btn small" id="tdUndo">${ICON.undo}Undo load ${n}</button>`:""}<span class="spacer"></span><button class="btn small ghost" id="tdFinish">${ICON.flag}Finish</button></div></div></div>
  ${greens?`<div class="sec" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px">Greens done · tap as you finish each one</div><div class="greens">${gList.map(g=>`<button class="gbtn" data-green="${g}" aria-pressed="${(job.greens||[]).includes(g)}">${g}</button>`).join("")}</div></div>
  <div style="margin-top:14px">${mapCard("topdressing",greenMarks(job),{hint:"Coloured greens are done"})}</div>`:""}
  ${n?`<div class="sec" style="margin-top:14px"><div class="eyebrow">Loads</div><div class="loadlog">${job.loads.slice().reverse().map((l,i)=>`<div class="${l.pend?"pend":""}"><b>Load ${n-i}</b><span>${fmt(l.t)} t · ${melTime(new Date(l.at))} · ${esc(l.by||"")}${l.pend?" · sending…":""}</span></div>`).join("")}</div></div>`:""}</div>`}
function greenMarks(job){const B=baseLayers();if(!B)return"";const done=new Set(job.greens||[]);return B.greens.map(g=>done.has(String(g.h))?`<path class="gdone" d="${ptsPath(g.p)}"/>`:"").join("")}

/* ------------------------------------------------------------------ stocktake + delivery sheets */
function stocktakeSheet(area){
  const items=stockOf(area);const std=(STD[area]||[]).filter(([n])=>!items.some(i=>i.name.toLowerCase()===n.toLowerCase()));

  <div class="sec" id="stRows">${items.map((i,k)=>countRow(i,k)).join("")}</div>
  <div class="sec"><div class="lab">Add something not on the list</div>${std.length?`<div class="chips" id="stStd">${std.map(([n,u])=>`<button class="chip sm" data-n="${esc(n)}" data-u="${esc(u)}">${esc(n)}</button>`).join("")}</div>`:""}<div class="row" style="margin-top:8px"><input class="field" id="stNew" placeholder="Item name" style="flex:2;min-width:150px"><input class="field" id="stNewU" placeholder="Unit (t, bags…)" style="flex:1;min-width:100px"><button class="btn small" id="stAdd">Add</button></div></div>
  <div class="sec">${whoField()}</div>
  <div class="sec"><button class="btn primary wide" id="stGo" style="min-height:56px;font-size:19px">${ICON.count}Send count</button></div>`,()=>{
    let idx=items.length;
    const addRow=(n,u)=>{if(!n)return;$("#stRows").insertAdjacentHTML("beforeend",countRow({name:n,unit:u,on:null,isNew:true},idx++));wireRows()};
    const wireRows=()=>{$$(".count").forEach(r=>{const i=$("input",r),ok=$(".ok",r);if(ok)ok.onclick=()=>{const on=ok.getAttribute("aria-pressed")==="true";ok.setAttribute("aria-pressed",!on);if(!on){i.value=r.dataset.exp}else i.value="";i.classList.toggle("set",!!i.value)};i.oninput=()=>{i.classList.toggle("set",i.value!=="");if(ok)ok.setAttribute("aria-pressed",i.value!==""&&i.value===r.dataset.exp)}})};
    wireRows();wireWho();
    $$("#stStd .chip").forEach(c=>c.onclick=()=>{addRow(c.dataset.n,c.dataset.u);c.remove()});
    $("#stAdd").onclick=()=>{addRow($("#stNew").value.trim(),$("#stNewU").value.trim());$("#stNew").value="";$("#stNewU").value=""};
    $("#stGo").onclick=()=>{const who=readWho();if(!who)return;const out=$$(".count").map(r=>({name:r.dataset.name,unit:r.dataset.unit,sid:r.dataset.sid||"",counted:$("input",r).value.trim()})).filter(x=>x.counted!==""&&!isNaN(parseFloat(x.counted))).map(x=>({...x,counted:parseFloat(x.counted)}));
      if(!out.length){toast("Nothing counted yet");return}
      const p={kind:"stocktake",id:uid("st"),area,by:who,items:out};send({...p});addPending({...p,at:new Date().toISOString()});closeSheet();toast(`Count sent: ${out.length} item${out.length===1?"":"s"}. Posted in ${chName(area)}.`);render()};
  });
}
function countRow(i,k){const exp=i.on==null?"":fmt(i.on);return `<div class="count" data-name="${esc(i.name)}" data-unit="${esc(i.unit||"")}" data-sid="${esc(i.sid||"")}" data-exp="${exp}"><div><div class="n">${esc(i.name)}</div><div class="e">${i.on==null?(i.isNew?"new item":"not counted before"):"should be "+exp+(i.unit?" "+esc(i.unit):"")}</div></div><div class="in">${exp!==""?`<button class="ok" aria-pressed="false" aria-label="Matches">✓</button>`:""}<input inputmode="decimal" placeholder="${i.unit?esc(i.unit):"count"}" aria-label="Count for ${esc(i.name)}"></div></div>`}
function chName(area){return area==="topdressing"?"#topdressing":GROUNDS[area]?GROUNDS[area].chName:AREAS[area].chName}
function deliverySheet(area){

function facts(){

  if(k==="keys"){const K=S.keys;if(K&&K.keys){const o=keysOut();const lost=o.filter(x=>x.status==="Lost").length,out=o.length-lost,late=o.filter(x=>x.overdue&&x.status!=="Lost").length;if(!o.length)f.push(`<span class="fact acc">All in</span>`);if(out)f.push(`<span class="fact acc">${out} out</span>`);if(late)f.push(`<span class="fact">${late} overdue</span>`);if(lost)f.push(`<span class="fact${out?"":" acc"}">${lost} missing</span>`);if(K.at)f.push(`<span class="fact">Checked ${melTime(new Date(K.at))}</span>`)}$("#facts").innerHTML=f.join("");return}

  else if(d){const j=jobsOf(k);const o=j.filter(isOpen);f.push(`<span class="fact acc">${o.length} open</span>`);const h=o.filter(x=>x.prio==="High").length;if(h)f.push(`<span class="fact">${h} high</span>`)}

  if(S.tab==="keys")wireKeys();
}
function pickJob(area,ref,fromList){
  S.sel[area]=ref;const j=jobsOf(area).find(x=>x.ref===ref);if(!j)return;
  $$(".job").forEach(r=>r.classList.toggle("sel",r.dataset.job===ref));$$(`#map-${area} .pin`).forEach(c=>c.classList.toggle("sel",c.dataset.tap===ref));
  const box=$("#pick-"+area);if(box)box.innerHTML=`<div style="margin-top:10px">${jobRow(j,area)}</div>${j.note?`<p class="note" style="margin:6px 4px 0">${esc(j.note)}</p>`:""}`;
  if(fromList){const pin=$(`#map-${area} .pin[data-tap="${ref}"]`);if(pin&&S.mapApi[area]){const B=baseLayers();const cx=Number(pin.getAttribute("cx")),cy=Number(pin.getAttribute("cy"));const w=(B.bounds[2]-B.bounds[0])/4;S.mapApi[area].set([cx-w/2,cy-w*0.354,w,w*0.708]);$(`#map-${area}`).scrollIntoView({behavior:"smooth",block:"center"})}}
}

/* ------------------------------------------------------------------ keys (shed key register) */
const KEY_ICON={out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
let keysBusy=null;
function keysOut(){return ((S.keys&&S.keys.keys)||[]).filter(k=>k.status!=="In")}
function keyNo(k){const m=String(k||"").match(/#?\s*(\d+)\s*$/);return m?"#"+m[1]:esc(String(k||"").replace(/^key\s*/i,""))}
function loadKeys(){
  if(keysBusy)return keysBusy;
  keysBusy=fetch(KEYS_API,{method:"POST",redirect:"follow",body:JSON.stringify({action:"keys"})}).then(r=>r.json()).then(r=>{
    if(!r||r.ok!==true)throw new Error((r&&r.error)||"no answer");
    S.keys={at:new Date().toISOString(),keys:r.keys||[],recent:Array.isArray(r.recent)?r.recent:null,dueRule:r.dueRule||""};LS.set("keys",S.keys);
  }).catch(e=>{S.keys=Object.assign({},S.keys||{},{err:String(e.message||e)})}).finally(()=>{keysBusy=null});
  return keysBusy;
}
function keyStatusTag(s){const t=String(s||"").toLowerCase();
  if(t==="out")return '<span class="tag Medium">Still out</span>';if(t==="lost")return '<span class="tag High">Missing</span>';
  if(t==="returned late")return '<span class="tag Medium">Back late</span>';if(t==="written off")return '<span class="tag High">Written off</span>';if(t==="cancelled")return '<span class="tag Low">Cancelled</span>';
  return '<span class="tag ok">Back</span>'}
function viewKeys(){
  const K=S.keys;const acts=`<div class="kacts"><button class="btn primary" data-keys="out">${KEY_ICON.out}Take a key</button><button class="btn ghost" data-keys="in">${KEY_ICON.back}Return a key</button></div>`;
  if(!K||!K.keys){return `${acts}<div class="card in">${K&&K.err?`<div class="head"><h2>Couldn't reach the key register</h2></div><p class="note">Check signal and try again. The shed QR codes still work.</p><div class="row" style="margin-top:10px"><button class="btn small" data-keys="retry">Try again</button></div>`:`<div class="head"><h2>Checking the key register…</h2></div><div class="kskel"></div>`}</div>`}
  const out=keysOut().sort((a,b)=>(b.status==="Lost")-(a.status==="Lost")||(b.overdue-a.overdue));
  const rec=K.recent;
  let hero;
  if(out.length){
    hero=`<div class="card in"><div class="head"><h2>${(()=>{const l=out.filter(k=>k.status==="Lost").length,n=out.length-l;return [n?(n===1?"1 key out":n+" keys out"):"",l?l+" missing":""].filter(Boolean).join(" · ")})()}</h2>${K.dueRule&&out.some(k=>k.status!=="Lost")?`<span class="sub">due back ${esc(K.dueRule)}</span>`:""}</div><div class="kout">${out.map(k=>{const bad=k.overdue||k.status==="Lost";
      return `<div class="krow${bad?" hi":""}"><div class="kno">${keyNo(k.key)}</div><div><div class="kwho">${esc(k.with||"Unknown")}</div><div class="kmeta"><span>Taken ${esc(k.since||"")}${k.sinceIso?` · <span data-ago="${k.sinceIso}">${ago(k.sinceIso)}</span>`:""}</span>${k.status==="Lost"?"<span>Reported missing</span>":k.due?`<span>Due back ${esc(k.due)}</span>`:""}</div></div>${k.status==="Lost"?'<span class="tag High">Missing</span>':k.overdue?'<span class="tag High">Overdue</span>':'<span class="tag Medium">Out</span>'}</div>`}).join("")}</div>
      ${keyBoard(K.keys)}</div>`;
  }else{
    hero=`<div class="card in"><div class="kallin"><span class="ok">${KEY_ICON.ok}</span><div><b>All keys are in</b><span class="note">${K.keys.length} spare key${K.keys.length===1?"":"s"} on the board</span></div></div>
      ${keyBoard(K.keys)}</div>`;
  }
  const recent=rec&&rec.length?`<div class="card in"><div class="head"><h2>${out.length?"Recent sign-outs":"Last taken"}</h2><span class="sub">newest first</span></div><div class="jobs">${rec.slice(0,8).map(r=>`<div class="job"><span class="kno" style="font-size:24px;min-width:2.4ch">${keyNo(r.key)}</span><div class="t">${esc(r.who)}</div>${keyStatusTag(r.status)}<div class="m"><span>Out ${esc(r.out)}</span>${r.back?`<span>Back ${esc(r.back)}${r.by&&r.by!==r.who?" · by "+esc(r.by.replace(/\s*\(for .*\)\s*$/,"")):""}</span>`:""}</div></div>`).join("")}</div></div>`
    :rec?`<div class="card in"><div class="head"><h2>Recent sign-outs</h2></div><p class="empty">No keys signed out yet.</p></div>`:"";
  return `${hero}${acts}<p class="note" style="margin:-4px 4px 0;text-align:center"><a href="#" data-keys="lost">Lost or missing key?</a></p>${recent}
  <p class="note" style="margin:0 4px">Take a key and Return a key open the same page as the shed QR codes (name, key SWP check, sign-off). Keys still out at ${esc(K.dueRule||"10am Tuesday")} get called out in Slack.</p>`;
}
function keyBoard(keys){return `<div class="kboard">${keys.map(k=>`<span class="kpill ${k.status}${k.overdue?" late":""}" title="${esc(k.key)}: ${k.status==="In"?"in":k.status==="Lost"?"missing":"with "+esc(k.with)}"><i></i>${keyNo(k.key)} ${k.status==="In"?"In":k.status==="Lost"?"Missing":esc((k.with||"").split(" ")[0])}</span>`).join("")}</div>`}
function openKeys(mode){
  const t={out:"Take a key",in:"Return a key",lost:"Lost or missing key"}[mode]||"Shed keys";const url=KEYS_PAGE+"?"+mode;
  $("#fullTitle").textContent=t;$("#fullOpen").href=url;$("#fullFrame").src=url;$("#full").hidden=false;document.body.style.overflow="hidden"}
function wireKeys(){
  $$("[data-keys]").forEach(b=>b.onclick=e=>{e.preventDefault();const m=b.dataset.keys;if(m==="retry"){S.keys=null;render();loadKeys().then(render);return}openKeys(m)});
}

/* topdressing wiring */
function wireTd(){
  $$("[data-tdkey]").forEach(b=>b.onclick=()=>{S.tdKey=b.dataset.tdkey;render()});
  const st=LS.get("tdPrefs",{area:"Greens",holes:"1-18",sand:"Kiln-dried sand",load_t:1});
  $$("[data-td]").forEach(g=>g.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;$$(".chip",g).forEach(x=>x.setAttribute("aria-pressed",x===c));const f=g.dataset.td;
    if(f==="holes"){$("#tdHoles").hidden=c.dataset.v!=="__other";if(c.dataset.v!=="__other")st.holes=c.dataset.v}
    else if(f==="sand"){$("#tdSand").hidden=c.dataset.v!=="__other";if(c.dataset.v!=="__other")st.sand=c.dataset.v}
    else st[f]=c.dataset.v;
    if(f==="area"&&c.dataset.v==="Practice greens"){st.holes="";$$('[data-td="holes"] .chip').forEach(x=>x.setAttribute("aria-pressed","false"))}});
  $$("[data-tdstep]").forEach(b=>b.onclick=()=>{const i=$("#tdLoadT");i.value=Math.max(.1,Math.round(((parseFloat(i.value)||1)+Number(b.dataset.tdstep))*10)/10)});
  wireWho();
  const start=$("#tdStart");if(start)start.onclick=()=>{const who=readWho();if(!who)return;const holes=!$("#tdHoles").hidden?$("#tdHoles").value.trim():st.holes;const sand=!$("#tdSand").hidden?$("#tdSand").value.trim():st.sand;const load_t=parseFloat($("#tdLoadT").value)||1;
    if(!sand){toast("Which sand?");return}
    LS.set("tdPrefs",{area:st.area,holes,sand,load_t});const p={kind:"td_start",key:uid("td"),area:st.area,holes,sand,load_t,by:who};S.tdKey=p.key;
    send({...p});addPending({...p,at:new Date().toISOString()});toast("Topdressing started. Tap a load each time the Turfco is filled.");render();window.scrollTo({top:0,behavior:"smooth"})};
  const job=tdJobs().find(j=>j.key===S.tdKey);if(!job)return;
  const ld=$("#tdLoad");if(ld)ld.onclick=()=>{const who=name()||"";if(!who){openSheet(`<h3>Who's this?</h3><div class="sec">${whoField()}</div><div class="sec"><button class="btn primary wide" id="whoGo">Save</button></div>`,()=>{wireWho();$("#whoGo").onclick=()=>{if(readWho()){closeSheet();ld.click()}}});return}
    const last=job.loads[job.loads.length-1];if(last&&Date.now()-Date.parse(last.at)<45000&&!confirm("Another load already? The last one was under a minute ago."))return;
    const p={kind:"td_load",key:job.key,load_key:uid("ld"),t:job.load_t||1,by:who,sand:job.sand};send({...p});addPending({...p,at:new Date().toISOString()});
    if(navigator.vibrate)navigator.vibrate(40);toast(`Load ${job.loads.length+1} counted`);render()};
  const un=$("#tdUndo");if(un)un.onclick=()=>{const last=job.loads[job.loads.length-1];if(!last)return;if(!confirm(`Take load ${job.loads.length} off? Only if it was tapped by mistake.`))return;
    const ob=outbox();const i=ob.findIndex(o=>o.kind==="td_load"&&o.load_key===last.key);
    if(i>=0){ob.splice(i,1);setOutbox(ob);LS.set("pending",pending().filter(p=>p.load_key!==last.key))}
    else{const p={kind:"td_undo",key:job.key,load_key:last.key,t:last.t,by:name()||"Someone"};send({...p});addPending({...p,at:new Date().toISOString()})}
    toast("Load taken off");render()};
  let gTimer=null;$$("[data-green]").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);const greens=$$("[data-green]").filter(x=>x.getAttribute("aria-pressed")==="true").map(x=>x.dataset.green);
    LS.set("pending",pending().filter(p=>!(p.kind==="td_greens"&&p.key===job.key)).concat([{kind:"td_greens",key:job.key,greens:JSON.stringify(greens),at:new Date().toISOString()}]));
    const svgWrap=$("#map-topdressing svg");if(svgWrap){$$(".gdone",svgWrap).forEach(x=>x.remove());const hn=svgWrap.querySelector(".hn");const tmp=document.createElementNS("http://www.w3.org/2000/svg","g");tmp.innerHTML=greenMarks({greens});[...tmp.childNodes].forEach(n=>svgWrap.insertBefore(n,hn))}
    clearTimeout(gTimer);gTimer=setTimeout(()=>send({kind:"td_greens",key:job.key,greens:JSON.stringify(greens),by:name()||"Someone"}),2500)});
  if($("#map-topdressing"))wireMap("topdressing",null);
  const fin=$("#tdFinish");if(fin)fin.onclick=()=>{openSheet(`<span class="eyebrow">${esc(job.id||"")}</span><h3>Finish topdressing</h3><p class="sub">${job.loads.length} load${job.loads.length===1?"":"s"}, ${fmt(job.t)} t of ${esc(job.sand||"sand")}. This goes in the job's thread in #topdressing.</p>
    <div class="sec"><div class="lab">Anything to add (optional)</div><textarea class="field" id="finNote" rows="3" placeholder="e.g. brushed in, watered in, 6 and 9 still to drag"></textarea></div><div class="sec">${whoField()}</div>
    <div class="sec"><button class="btn primary wide" id="finGo" style="min-height:56px;font-size:19px">${ICON.flag}Finish</button></div>`,()=>{wireWho();$("#finGo").onclick=()=>{const who=readWho();if(!who)return;clearTimeout(gTimer);
      const greens=JSON.stringify(job.greens||[]);const p={kind:"td_done",key:job.key,greens,note:$("#finNote").value.trim(),by:who};send({...p});addPending({...p,at:new Date().toISOString()});closeSheet();toast("Topdressing finished. Nice work.");render()}})};
}

/* ------------------------------------------------------------------ routing */
function go(tab){if(!AREAS[tab])tab="map";S.tab=tab;LS.set("tab",tab);history.replaceState(null,"","#"+(tab==="grounds"?"grounds-"+S.sub:tab));render();window.scrollTo({top:0})}
function fromHash(){const h=location.hash.slice(1);if(h.startsWith("grounds")){S.tab="grounds";const s=h.split("-")[1];if(GROUNDS[s])S.sub=s}else if(AREAS[h])S.tab=h;else{S.tab=LS.get("tab","map");S.sub=LS.get("sub","amstel")}}
window.addEventListener("hashchange",()=>{fromHash();render()});

/* theme: follow the phone, or pick */
function applyTheme(){const t=LS.get("theme","auto");if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t}
$("#theme").onclick=()=>{const t=LS.get("theme","auto");const n=t==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"):t==="dark"?"light":"auto";LS.set("theme",n);applyTheme();toast(n==="auto"?"Following the phone's light/dark":n==="dark"?"Dark":"Light")};
$("#who").onclick=()=>openSheet(`<h3>Who's using this phone?</h3><p class="sub">Your name goes on stocktakes, sand and loads you log here.</p><div class="sec">${whoField()}</div><div class="sec"><button class="btn primary wide" id="whoGo">Save</button></div>`,()=>{wireWho();$("#whoGo").onclick=()=>{if(readWho()){closeSheet();toast("Saved")}}});

/* ------------------------------------------------------------------ start */
applyTheme();if(TEST)$("#testbar").hidden=false;fromHash();showOutbox();S.keys=LS.get("keys",null);if(S.keys)delete S.keys.err;
loadKeys().then(()=>{if(S.tab==="keys")render();else if($("#tabs .tab"))renderTabs()});
loadAll().then(()=>{render();flush()});
let lastLive=Date.now();
let lastKeys=Date.now();
async function tick(all){if(document.hidden)return;if(S.tab==="keys"&&(all||Date.now()-lastKeys>55000)){lastKeys=Date.now();await loadKeys()}if(all)await loadAll();else await loadLive();lastLive=Date.now();if($("#sheet").hidden&&$("#full").hidden&&sig()!==lastSig)render()}
setInterval(()=>{if(S.tab==="topdressing"||S.tab==="keys"||Date.now()-lastLive>45000)tick(false)},20000);
setInterval(()=>tick(true),300000);
setInterval(()=>$$("[data-ago]").forEach(el=>el.textContent=ago(el.dataset.ago).replace(el.dataset.trim||"\u0000","")),30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick(false);flush()}});
</script>
