<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Growth potential recap</title>
<!--
  Growth potential recap video for Greens Live (PACE Turf model).
  Rendered frame by frame by _video/build.py: build.py calls window.__setup(payload) once, then
  window.__render(t) for every frame and screenshots the page. Everything on screen is a pure
  function of t (seconds), so a render is exact and repeatable. Nothing here uses timers or rAF.
-->
<style>
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'Inter Tight';src:url(fonts/inter-tight-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Inter Tight';src:url(fonts/inter-tight-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Inter Tight';src:url(fonts/inter-tight-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'Inter Tight';src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{
  --bg:#0a120d; --ink:#eef2ea; --muted:#9fb1a4; --faint:#6f8274; --line:rgba(238,242,234,.11);
  --cool:#6fe0a0; --cool2:#37c3b0; --warm:#f4a75a; --warm2:#f07f45; --hot:#ff7a66;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate}
.layer{position:absolute;inset:0}
.s{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
svg{overflow:visible}
.serif{font-family:var(--serif)}

/* background */
#bg-glow{background:
  radial-gradient(1100px 760px at var(--gx1,18%) var(--gy1,8%),rgba(55,195,176,.20),transparent 60%),
  radial-gradient(1000px 800px at var(--gx2,92%) var(--gy2,96%),rgba(244,167,90,.13),transparent 62%),
  radial-gradient(1400px 900px at 50% 50%,#0e1912 0%,#0a120d 70%)}
#vignette{background:radial-gradient(1500px 980px at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:40}
#grain{z-index:41;opacity:.07;mix-blend-mode:overlay;background-repeat:repeat}

/* chrome */
#chrome{z-index:30}
.brand{position:absolute;left:96px;top:62px;display:flex;align-items:center;gap:16px;font-size:24px;letter-spacing:.22em;font-weight:600;color:var(--muted);text-transform:uppercase}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--cool);box-shadow:0 0 0 0 rgba(111,224,160,.6)}
.asof{position:absolute;right:96px;top:58px;font-size:26px;color:var(--muted);letter-spacing:.02em}
.asof b{color:var(--ink);font-weight:600}
.credit{position:absolute;right:96px;bottom:56px;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.chap{position:absolute;left:96px;bottom:52px;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;gap:14px;align-items:center}
.chap span{color:var(--cool)}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--cool) 0%,var(--cool2) 45%,var(--warm) 100%);box-shadow:0 0 14px rgba(111,224,160,.5)}

/* shared type */
.kick{font-size:26px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--cool)}
.h2{font-family:var(--serif);font-weight:400;font-size:76px;line-height:1.04;letter-spacing:-.01em}
.h2 em{font-style:italic;color:var(--cool)}
.lead{font-size:36px;line-height:1.3;color:var(--muted)}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.mask>span{display:inline-block}

/* title */
.s-title .wrap{position:absolute;left:0;right:0;top:300px;text-align:center}
.s-title .kick{display:flex;align-items:center;justify-content:center;gap:26px}
.s-title .kick .ln{display:block;width:120px;height:2px;background:var(--cool);transform-origin:50% 50%}
.s-title h1{font-family:var(--serif);font-weight:400;font-size:196px;line-height:1;letter-spacing:-.02em;margin-top:30px}
.s-title h1 .w2{font-style:italic;color:var(--cool)}
.s-title .sub{font-size:44px;color:var(--ink);margin-top:34px;opacity:.92}
.s-title .meta{font-size:30px;color:var(--muted);margin-top:22px;letter-spacing:.04em}

/* today */
.s-today .left{position:absolute;left:96px;top:190px;width:640px}
.s-today .date{font-family:var(--serif);font-size:96px;line-height:1;margin-top:26px}
.s-today .tlab{font-size:30px;color:var(--muted);margin-top:64px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.s-today .temp{font-family:var(--serif);font-size:168px;line-height:1;margin-top:8px}
.s-today .temp small{font-size:72px;color:var(--muted);margin-left:6px}
.s-today .tnote{font-size:30px;color:var(--muted);margin-top:18px;line-height:1.35}
.ring{position:absolute;width:480px;text-align:center}
.ring svg{display:block;margin:0 auto}
.ring .val{position:absolute;left:0;right:0;top:160px;font-family:var(--serif);font-size:150px;line-height:1}
.ring .val small{font-size:62px;color:var(--muted)}
.ring .nm{font-size:50px;font-weight:600;margin-top:22px}
.ring .ty{font-size:31px;color:var(--muted);margin-top:6px}
.ring .opt{font-size:29px;color:var(--faint);margin-top:10px;line-height:1.35}
.ring .opt b{color:var(--ink);font-weight:600}

/* charts */
.ax text{font-family:var(--sans);font-size:26px;fill:var(--faint)}
.grid line{stroke:var(--line);stroke-width:2}
.pill{font-family:var(--sans);font-weight:600;font-size:30px}
.halo{paint-order:stroke;stroke:#0a120d;stroke-width:12px;stroke-linejoin:round}

/* model */
.s-model .head{position:absolute;left:96px;top:170px;width:1500px}
.s-model .head .h2{margin-top:20px}
.s-model .head .lead{margin-top:18px}

/* 30 days */
.s-hist .head{position:absolute;left:96px;top:170px;width:1720px}
.s-hist .head .h2{margin-top:20px}
.chips{position:absolute;left:1330px;top:428px;width:500px;display:flex;flex-direction:column;gap:18px}
.chip{border:2px solid var(--line);border-radius:22px;padding:15px 26px 16px;background:rgba(255,255,255,.025)}
.chip .l{font-size:26px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.chip .v{font-family:var(--serif);font-size:62px;line-height:1.05;margin-top:2px}
.chip .v small{font-size:34px;color:var(--muted);font-family:var(--sans);margin-left:8px}
.chip .d{font-size:27px;color:var(--muted);margin-top:2px}
.chip .d b{font-weight:600}

/* forecast */
.s-fc .head{position:absolute;left:96px;top:170px;width:1700px}
.s-fc .head .h2{margin-top:20px}
.cols{position:absolute;left:96px;right:96px;top:350px;height:620px;display:flex;gap:18px}
.col{flex:1;position:relative;border:2px solid var(--line);border-radius:26px;background:rgba(255,255,255,.03);overflow:hidden}
.col.hot{border-color:rgba(255,122,102,.75);background:linear-gradient(180deg,rgba(255,122,102,.12),rgba(255,255,255,.02) 55%)}
.col .dw{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:44px;font-weight:600}
.col .dt{position:absolute;left:0;right:0;top:76px;text-align:center;font-size:26px;color:var(--muted)}
.col .tp{position:absolute;left:0;right:0;top:116px;text-align:center;font-size:30px;color:var(--ink)}
.col .tp span{color:var(--faint)}
.col .badge{position:absolute;right:14px;top:14px;font-size:19px;font-weight:700;letter-spacing:.12em;color:#1a0d0a;background:var(--hot);border-radius:999px;padding:5px 11px}
.col .bars{position:absolute;left:0;right:0;bottom:62px;height:300px}
.col .bar{position:absolute;bottom:0;width:58px;border-radius:14px 14px 4px 4px;transform-origin:50% 100%}
.col .bar.c{background:linear-gradient(180deg,var(--cool),var(--cool2));box-shadow:0 0 22px rgba(111,224,160,.35)}
.col .bar.w{background:linear-gradient(180deg,var(--warm),var(--warm2));box-shadow:0 0 22px rgba(244,167,90,.3)}
.col .bl{position:absolute;width:90px;text-align:center;font-size:31px;font-weight:600}
.col .mn{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:24px;color:var(--faint)}
.legend{position:absolute;right:96px;top:176px;display:flex;gap:34px;font-size:27px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:22px;border-radius:6px;margin-right:12px;vertical-align:-3px}

/* takeaways */
.s-means .head{position:absolute;left:96px;top:170px}
.s-means .head .h2{margin-top:20px}
.rows{position:absolute;left:96px;top:390px;width:1700px;display:flex;flex-direction:column;gap:46px}
.row{display:flex;gap:40px;align-items:flex-start}
.row .ic{flex:0 0 92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:48px;color:#08100b}
.row .tx .hd{font-size:52px;font-weight:600;line-height:1.1}
.row .tx .dt{font-size:34px;color:var(--muted);line-height:1.32;margin-top:10px;max-width:1500px}

/* end */
.s-end .wrap{position:absolute;left:0;right:0;top:250px;text-align:center}
.s-end h3{font-family:var(--serif);font-weight:400;font-size:120px;line-height:1;margin-top:28px}
.s-end h3 em{color:var(--cool)}
.s-end .ln{width:160px;height:2px;background:var(--cool);margin:44px auto 40px}
.s-end p{font-size:32px;color:var(--muted);line-height:1.6}
.s-end p b{color:var(--ink);font-weight:600}
.s-end .auto{margin-top:34px;font-size:28px;color:var(--cool);letter-spacing:.06em}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg-glow"></div>
  <svg class="layer" id="bg-topo" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div class="layer" id="scenes"></div>
  <div class="layer" id="chrome">
    <div class="brand"><i id="live"></i>Ranfurlie · Greens Live</div>
    <div class="asof" id="asof"></div>
    <div class="chap" id="chap"></div>
    <div class="credit" id="credit">PACE Turf growth potential</div>
    <div id="prog"></div>
  </div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="grain"></div>
</div>
<script>
(function(){
'use strict';
var W = 1920, H = 1080, D = null, SC = [], TOTAL = 0;
var NS = 'http://www.w3.org/2000/svg';
var $ = function(s, r){ return (r || document).querySelector(s); };
var clamp = function(x, a, b){ a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return Math.min(b, Math.max(a, x)); };
var seg = function(t, a, b){ return clamp((t - a) / (b - a)); };
var lerp = function(a, b, x){ return a + (b - a) * x; };
var E = {
  out3: function(x){ return 1 - Math.pow(1 - x, 3); },
  out4: function(x){ return 1 - Math.pow(1 - x, 4); },
  inout3: function(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  outExpo: function(x){ return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); },
  outBack: function(x){ var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
function el(tag, cls, html, parent){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function sv(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function pct(x){ return Math.round(x * 100); }
function fmt1(x){ return (Math.round(x * 10) / 10).toFixed(1); }
function gp(t, opt, v){ return Math.exp(-0.5 * Math.pow((t - opt) / v, 2)); }
// enter: rise + fade; returns 0..1 progress
function rise(node, t, a, dur, dist){ var p = E.out3(seg(t, a, a + (dur || .7))); node.style.opacity = p; node.style.transform = 'translateY(' + ((1 - p) * (dist == null ? 40 : dist)) + 'px)'; return p; }
function maskIn(node, t, a, dur){ var p = E.out4(seg(t, a, a + (dur || .9))); node.style.transform = 'translateY(' + ((1 - p) * 110) + '%)'; return p; }
function drawPath(path, len, p){ path.style.strokeDasharray = len + ' ' + len; path.style.strokeDashoffset = len * (1 - p); }
function count(node, from, to, p, dec){ var v = lerp(from, to, p); node.textContent = dec ? fmt1(v) : String(Math.round(v)); }

// deterministic noise texture for film grain
function grain(){
  var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d'); var im = g.createImageData(256, 256); var s = 1234567;
  for (var i = 0; i < im.data.length; i += 4){ s = (s * 1103515245 + 12345) & 0x7fffffff; var v = (s >> 16) & 255; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
  g.putImageData(im, 0, 0); $('#grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
}
// topographic contour rings: the course as a contour map, slowly breathing
var topo = [];
function buildTopo(){
  var svg = $('#bg-topo'), g = sv('g', {}, svg);
  for (var i = 0; i < 22; i++){
    var r0 = 90 + i * 64, d = '';
    for (var k = 0; k <= 180; k++){
      var a = k / 180 * Math.PI * 2;
      var r = r0 * (1 + .075 * Math.sin(3 * a + i * .55) + .045 * Math.sin(5 * a - i * .9) + .025 * Math.sin(9 * a + i * 1.7));
      d += (k ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r * .78).toFixed(1);
    }
    var p = sv('path', {d: d + 'Z', fill: 'none', stroke: i % 5 === 0 ? 'rgba(111,224,160,.085)' : 'rgba(170,210,180,.045)', 'stroke-width': i % 5 === 0 ? 2.2 : 1.4}, g);
    topo.push(p);
  }
  topo.g = g;
}

/* ---------- scenes ---------- */
function scene(id, dur, build, render, chap){ var root = el('div', 's s-' + id, null, $('#scenes')); var o = {id: id, dur: dur, root: root, render: render, chap: chap}; build(root, o); SC.push(o); return o; }

function sTitle(){
  scene('title', 4.4, function(r, o){
    var w = el('div', 'wrap', null, r);
    o.k = el('div', 'kick', '<span class="ln"></span><span class="kt">PACE Turf model</span><span class="ln"></span>', w);
    var h = el('h1', '', '<span class="mask"><span>Growth</span></span> <span class="mask"><span class="w2">potential</span></span>', w);
    o.ws = h.querySelectorAll('.mask>span');
    o.sub = el('div', 'sub', 'How hard the weather is letting the grass grow', w);
    o.meta = el('div', 'meta', 'Ranfurlie Golf Club · ' + D.build_label, w);
    // decorative curve behind the title
    var svg = sv('svg', {width: W, height: H, viewBox: '0 0 1920 1080', style: 'position:absolute;inset:0;z-index:-1'}, r);
    var d = ''; for (var x = 0; x <= 1920; x += 8){ var y = 900 - 520 * gp(x, 960, 300); d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1); }
    o.deco = sv('path', {d: d, fill: 'none', stroke: 'url(#tg)', 'stroke-width': 3, opacity: .55}, svg);
    var defs = sv('defs', {}, svg), lg = sv('linearGradient', {id: 'tg', x1: 0, x2: 1, y1: 0, y2: 0}, defs);
    sv('stop', {offset: '0', 'stop-color': '#37c3b0', 'stop-opacity': 0}, lg); sv('stop', {offset: '.5', 'stop-color': '#6fe0a0'}, lg); sv('stop', {offset: '1', 'stop-color': '#f4a75a', 'stop-opacity': 0}, lg);
    o.decoLen = o.deco.getTotalLength();
  }, function(t, o){
    var lns = o.k.querySelectorAll('.ln'), kt = o.k.querySelector('.kt');
    var p = E.out3(seg(t, .15, 1.0)); lns.forEach(function(l){ l.style.transform = 'scaleX(' + p + ')'; });
    kt.style.opacity = seg(t, .25, .8); kt.style.letterSpacing = lerp(.5, .24, E.out3(seg(t, .2, 1.2))) + 'em';
    maskIn(o.ws[0], t, .35, 1.0); maskIn(o.ws[1], t, .5, 1.0);
    rise(o.sub, t, 1.15, .8, 26); rise(o.meta, t, 1.45, .8, 20);
    drawPath(o.deco, o.decoLen, E.inout3(seg(t, 0, 2.6)));
  });
}

function sToday(){
  var L = D.latest;
  scene('today', 7.8, function(r, o){
    var left = el('div', 'left', null, r);
    o.kick = el('div', 'kick', 'Latest day on course', left);
    o.date = el('div', 'date', L.label, left);
    o.tlab = el('div', 'tlab', 'Mean temperature', left);
    o.temp = el('div', 'temp', '<span>0.0</span><small>°C</small>', left);
    o.tv = o.temp.querySelector('span');
    o.tnote = el('div', 'tnote', 'Daily mean from the on-course weather station: the number the model runs on.', left);
    o.rings = [];
    [['cool', L.cool, 'Greens', 'Bent and Poa · cool season', D.model.cool_opt, L.t - D.model.cool_opt, 830],
     ['warm', L.warm, 'Couch', 'Fairways · warm season', D.model.warm_opt, L.t - D.model.warm_opt, 1340]].forEach(function(a){
      var box = el('div', 'ring', null, r); box.style.left = a[6] + 'px'; box.style.top = '210px';
      var R = 176, C = 2 * Math.PI * R, svg = sv('svg', {width: 480, height: 480, viewBox: '-240 -240 480 480'}, box);
      var defs = sv('defs', {}, svg), lg = sv('linearGradient', {id: 'rg' + a[0], x1: 0, y1: 0, x2: 1, y2: 1}, defs);
      sv('stop', {offset: '0', 'stop-color': a[0] === 'cool' ? '#37c3b0' : '#f4c25a'}, lg); sv('stop', {offset: '1', 'stop-color': a[0] === 'cool' ? '#6fe0a0' : '#f07f45'}, lg);
      sv('circle', {r: R, fill: 'none', stroke: 'rgba(238,242,234,.08)', 'stroke-width': 26}, svg);
      var ticks = [], tg = sv('g', {}, svg);
      for (var i = 0; i < 60; i++){ var an = (i / 60) * Math.PI * 2 - Math.PI / 2; ticks.push(sv('line', {x1: Math.cos(an) * 206, y1: Math.sin(an) * 206, x2: Math.cos(an) * (i % 5 ? 218 : 226), y2: Math.sin(an) * (i % 5 ? 218 : 226), stroke: 'rgba(238,242,234,.14)', 'stroke-width': i % 5 ? 3 : 4, 'stroke-linecap': 'round'}, tg)); }
      var arc = sv('circle', {r: R, fill: 'none', stroke: 'url(#rg' + a[0] + ')', 'stroke-width': 26, 'stroke-linecap': 'round', transform: 'rotate(-90)', style: 'filter:drop-shadow(0 0 16px ' + (a[0] === 'cool' ? 'rgba(111,224,160,.55)' : 'rgba(244,167,90,.5)') + ')'}, svg);
      var dot = sv('circle', {r: 9, fill: '#fff', style: 'filter:drop-shadow(0 0 10px #fff)'}, svg);
      var val = el('div', 'val', '<span>0</span><small>%</small>', box);
      var nm = el('div', 'nm', a[2], box); nm.style.color = a[0] === 'cool' ? 'var(--cool)' : 'var(--warm)';
      var ty = el('div', 'ty', a[3], box);
      var diff = a[5], dtx = Math.abs(diff) < .3 ? 'right on it' : fmt1(Math.abs(diff)) + '° ' + (diff > 0 ? 'above' : 'below');
      var opt = el('div', 'opt', 'Optimum ' + a[4] + ' °C<br><b>' + dtx + '</b>', box);
      o.rings.push({box: box, C: C, arc: arc, dot: dot, ticks: ticks, v: a[1], val: val.querySelector('span'), nm: nm, ty: ty, opt: opt, kind: a[0], R: R});
    });
  }, function(t, o){
    rise(o.kick, t, .1, .7); rise(o.date, t, .25, .8);
    rise(o.tlab, t, .55, .7, 24); var pt = rise(o.temp, t, .7, .8, 24);
    count(o.tv, 0, L.t, E.out3(seg(t, .7, 2.0)), true); rise(o.tnote, t, 1.3, .8, 20);
    o.rings.forEach(function(g, i){
      var a = .9 + i * .35, p = E.out4(seg(t, a, a + 2.0)), v = g.v * p;
      g.box.style.opacity = E.out3(seg(t, a - .3, a + .4)); g.box.style.transform = 'scale(' + lerp(.92, 1, E.out3(seg(t, a - .3, a + .8))) + ')';
      g.arc.style.strokeDasharray = (g.C * v) + ' ' + g.C;

// monotone cubic path (no overshoot below 0% or above 100%)
function mono(pts){

  for (i = 1; i < n - 1; i++) tg[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (i = 0; i < n - 1; i++){ if (m[i] === 0){ tg[i] = tg[i+1] = 0; continue; } var a = tg[i] / m[i], b = tg[i+1] / m[i], s = a * a + b * b; if (s > 9){ var k = 3 / Math.sqrt(s); tg[i] = k * a * m[i]; tg[i+1] = k * b * m[i]; } }

  for (i = 0; i < n - 1; i++){ var h = dx[i] / 3; d += 'C' + (pts[i][0] + h).toFixed(1) + ' ' + (pts[i][1] + tg[i] * h).toFixed(1) + ' ' + (pts[i+1][0] - h).toFixed(1) + ' ' + (pts[i+1][1] - tg[i+1] * h).toFixed(1) + ' ' + pts[i+1][0].toFixed(1) + ' ' + pts[i+1][1].toFixed(1); }
  return d;
}

    o.a = el('div', 'auto', 'Rebuilt automatically every time Greens Live updates · data to ' + D.asof_long, w);
  }, function(t, o){
    rise(o.k, t, .15, .7, 20); rise(o.h, t, .3, .9, 30);
    o.ln.style.transform = 'scaleX(' + E.out3(seg(t, .6, 1.4)) + ')';
    rise(o.p, t, .8, .9, 20); rise(o.a, t, 1.2, .9, 16);
  }, '');
}

/* ---------- timeline ---------- */
var OVER = .45; // scene cross-over
function layout(){ var s = 0; SC.forEach(function(o, i){ o.start = s; s += o.dur - (i < SC.length - 1 ? OVER : 0); }); TOTAL = s; }

window.__setup = function(payload){
  D = payload;
  $('#asof').innerHTML = 'Data to <b>' + D.asof_label + '</b>';
  grain(); buildTopo();
  sTitle(); sToday(); sModel(); sHist();
  if (D.forecast && D.forecast.days && D.forecast.days.length) sForecast();
  if (D.takeaways && D.takeaways.length) sMeans();
  sEnd();
  layout();
  window.__render(0);
  return TOTAL;
};

window.__marks = function(){ return SC.map(function(o){ return {id: o.id, start: o.start, dur: o.dur}; }); };

window.__render = function(t){
  // background drift
  var bg = $('#bg-glow').style;
  bg.setProperty('--gx1', (18 + 6 * Math.sin(t * .21)) + '%'); bg.setProperty('--gy1', (8 + 5 * Math.cos(t * .17)) + '%');
  bg.setProperty('--gx2', (92 - 5 * Math.sin(t * .15)) + '%'); bg.setProperty('--gy2', (96 - 6 * Math.cos(t * .19)) + '%');
  topo.g.setAttribute('transform', 'translate(' + (1520 + 30 * Math.sin(t * .08)) + ' ' + (250 + 20 * Math.cos(t * .07)) + ') rotate(' + (t * 1.1) + ') scale(' + (1 + .03 * Math.sin(t * .3)) + ')');
  var gr = window.__grain || 'static', fr = Math.round(t * 30); $('#grain').style.display = gr === 'off' ? 'none' : 'block'; $('#grain').style.backgroundPosition = gr === 'moving' ? ((fr * 73) % 256) + 'px ' + ((fr * 151) % 256) + 'px' : '0 0';
  var live = $('#live'), ph = (t % 1.6) / 1.6; live.style.boxShadow = '0 0 0 ' + (ph * 14) + 'px rgba(111,224,160,' + (0.55 * (1 - ph)) + ')';
  $('#prog').style.transform = 'scaleX(' + clamp(t / TOTAL) + ')';
  var chapTxt = '', chromeOn = 0;
  SC.forEach(function(o, i){
    var lt = t - o.start, inn = i === 0 ? 1 : E.out3(seg(lt, 0, OVER + .1)), out = i === SC.length - 1 ? 1 : 1 - E.inout3(seg(lt, o.dur - OVER - .05, o.dur));
    var vis = lt >= -0.001 && lt <= o.dur + .001 ? Math.min(inn, out) : 0;
    o.root.style.opacity = vis;
    o.root.style.transform = vis < 1 && lt > o.dur / 2 ? 'translateY(' + (-(1 - out) * 30) + 'px)' : 'none';
    o.root.style.display = vis > 0 ? 'block' : 'none';
    if (vis > 0){ o.render(clamp(lt, 0, o.dur), o); if (vis > .5 && o.chap){ chapTxt = o.chap; } if (o.id !== 'title' && o.id !== 'end') chromeOn = Math.max(chromeOn, vis); }
  });
  var chap = $('#chap'); if (chapTxt && chap.dataset.t !== chapTxt){ chap.dataset.t = chapTxt; chap.innerHTML = '<span>●</span>' + chapTxt; }
  $('#credit').style.opacity = chromeOn * .9; chap.style.opacity = chromeOn;
};
})();
</script>
