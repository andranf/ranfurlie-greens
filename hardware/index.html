<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranfurlie Hardware Map</title>
<meta name="description" content="Valves, drains, QCVs and problems pinned by the Ranfurlie crew.">
<meta property="og:title" content="Ranfurlie hardware map">
<meta property="og:description" content="Valves, drains, QCVs and problems pinned by the crew. Tap to open the pin.">
<meta property="og:image" content="https://andranf.github.io/ranfurlie-greens/hardware/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b2231">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Ranfurlie Hardware Map v1.1 (24 Oct 2026): + Mainline tab (pipes, valves, water simulation, valve finder, editing)
   and the MetroMap Jan 2026 aerial. v1.0 (24 Oct 2026):
   Crew pin permanent hardware (valves, QCVs, drain pits...) and problems (leaks, wet spots, blocked drains) with phone GPS.
   Problems and failed hardware post to #irrigation / #drainage through the Zapier "Hardware map" hook, with a link back to the pin.
   Records live in hardware/live.json (written by that workflow). Reference layers (Cirrus heads, as-built valves and pits)
   come from hardware/ref.json. Cirrus Pro layers: one small KML per hardware type from the Layers sheet.
   Design: the tank-mix glass system (Barlow / Barlow Condensed, frosted rim-lit panels) floating over the aerial. */
:root{
  color-scheme:light;
  --bg:#e4f1f7;
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.82); --glass-lo:rgba(255,255,255,.38); --glass-solid:rgba(246,251,253,.96); --sheet:#f3f9fb;
  --rim:rgba(255,255,255,.9); --rim2:rgba(255,255,255,.35); --edge:rgba(16,52,72,.10);
  --shadow:0 18px 40px -18px rgba(14,52,76,.45),0 2px 6px -2px rgba(14,52,76,.16);
  --fg:#0b2231; --muted:#3f5d6e; --faint:#6f8a99; --line:rgba(16,52,72,.12);
  --go:#13a356; --go2:#2fd27a; --go-ink:#ffffff; --go-soft:rgba(47,210,122,.18);
  --tank:#0aa6dc; --tank-deep:#0573a8; --tank-soft:rgba(10,166,220,.14);
  --poison:#e0313b; --poison-bg:rgba(224,49,59,.13); --caution:#a86000; --caution-bg:rgba(255,176,32,.2); --ok:#13a356;
  --scrim:rgba(8,30,44,.38);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:26px; --r2:18px; --ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#06121b;
  --glass:rgba(16,36,52,.62); --glass-hi:rgba(28,58,78,.74); --glass-lo:rgba(18,40,56,.42); --glass-solid:rgba(14,34,48,.97); --sheet:#0f2433;
  --rim:rgba(255,255,255,.22); --rim2:rgba(255,255,255,.06); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.65),0 2px 6px -2px rgba(0,0,0,.45);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.1);
  --go:#2fd27a; --go2:#6ff0a6; --go-ink:#03210f; --go-soft:rgba(47,210,122,.18);
  --tank:#38c6ff; --tank-deep:#1490cc; --tank-soft:rgba(56,198,255,.14);
  --poison:#ff5c5c; --poison-bg:rgba(255,92,92,.16); --caution:#ffbc45; --caution-bg:rgba(255,188,69,.16); --ok:#2fd27a;
  --scrim:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#06121b;
  --glass:rgba(16,36,52,.62); --glass-hi:rgba(28,58,78,.74); --glass-lo:rgba(18,40,56,.42); --glass-solid:rgba(14,34,48,.97); --sheet:#0f2433;
  --rim:rgba(255,255,255,.22); --rim2:rgba(255,255,255,.06); --edge:rgba(0,0,0,.35);
  --shadow:0 18px 44px -16px rgba(0,0,0,.65),0 2px 6px -2px rgba(0,0,0,.45);
  --fg:#f1f8fb; --muted:#a9c4d2; --faint:#7896a6; --line:rgba(255,255,255,.1);
  --go:#2fd27a; --go2:#6ff0a6; --go-ink:#03210f; --go-soft:rgba(47,210,122,.18);
  --tank:#38c6ff; --tank-deep:#1490cc; --tank-soft:rgba(56,198,255,.14);
  --poison:#ff5c5c; --poison-bg:rgba(255,92,92,.16); --caution:#ffbc45; --caution-bg:rgba(255,188,69,.16); --ok:#2fd27a;
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:#20323b}
.leaflet-container{font-family:var(--body);background:#20323b}
.leaflet-control-attribution{font-size:10px;background:rgba(0,0,0,.35)!important;color:rgba(255,255,255,.75)!important;margin-bottom:var(--safe-b)!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.85)!important}

/* glass */
.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass) 38%,var(--glass));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2),inset 0 -1px 0 var(--edge),var(--shadow)}
.inset{box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2)}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(10px + var(--safe-t)) 12px 0;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;border-radius:22px;padding:8px 8px 8px 14px;max-width:760px;margin:0 auto}
.bar .t{flex:1;min-width:0}
.bar h1{margin:0;font-family:var(--display);font-weight:800;font-size:23px;line-height:1;letter-spacing:.01em}
.bar .sub{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ib{border:0;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);transition:transform .15s var(--ease)}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{pointer-events:auto;display:flex;gap:7px;overflow-x:auto;padding:9px 2px 6px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;border-radius:999px;padding:6px 13px 6px 10px;display:flex;align-items:center;gap:7px;color:var(--muted);transition:opacity .2s,transform .15s}
.chip .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8}
.chip.off{opacity:.55}.chip.off .dot{background:transparent!important;box-shadow:inset 0 0 0 2px var(--faint)}
.chip:active{transform:scale(.96)}

/* corner buttons */
.fabs{position:fixed;right:12px;bottom:calc(104px + var(--safe-b));z-index:500;display:grid;gap:10px}
.fabs .ib{width:52px;height:52px;border-radius:18px}
.fabs .ib.on svg{stroke:var(--tank)}
.add{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--safe-b));z-index:500;border:0;cursor:pointer;border-radius:999px;padding:0 28px 0 22px;min-height:64px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;background:linear-gradient(180deg,var(--go2),var(--go));color:var(--go-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.08),0 14px 30px -12px rgba(0,0,0,.55);transition:transform .15s var(--ease)}
.add:active{transform:translateX(-50%) scale(.97)}
.add svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}

/* sheets */
.scrim{position:fixed;inset:0;z-index:900;background:var(--scrim);animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;max-width:640px;margin:0 auto;border-radius:28px 28px 0 0;padding:8px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--glass-solid);box-shadow:inset 0 1px 0 var(--rim),0 -18px 40px -16px rgba(0,0,0,.45);animation:up .32s var(--ease) both}
.sheet.peek{max-height:62vh}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;margin:2px 0 4px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.sheet p{margin:6px 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.x{position:absolute;right:12px;top:10px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border:0;cursor:pointer;text-align:left;border-radius:18px;padding:11px 12px;min-height:66px;display:flex;align-items:center;gap:10px;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);transition:transform .15s var(--ease),background .2s}
.tile:active{transform:scale(.97)}
.tile .ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--display);font-weight:700;font-size:18.5px;line-height:1.05;display:block}
.tile small{display:block;color:var(--faint);font-size:12.5px;line-height:1.2;margin-top:2px}
.tile.sel{background:var(--tank-soft);box-shadow:inset 0 0 0 2px var(--tank)}

.btn{border:0;border-radius:999px;padding:10px 20px;font-family:var(--display);font-weight:700;font-size:20px;cursor:pointer;min-height:54px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(180deg,var(--go2),var(--go));color:var(--go-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px -12px var(--go)}
.btn.go:disabled{opacity:.4}
.btn.soft{background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2)}
.btn.stop{background:var(--poison-bg);color:var(--poison)}
.btn.sm{min-height:42px;font-size:17px;padding:6px 15px}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts .btn,a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
@media (min-width:520px){.acts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:0;cursor:pointer;border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:17px;background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2);color:var(--muted)}
.opt.sel{background:var(--tank);color:#fff;box-shadow:none}
.opt.good.sel{background:var(--go)}
.opt.work.sel{background:#e08a00}
.opt.fail.sel{background:var(--poison)}
label.f{display:block;font-weight:600;font-size:14px;color:var(--muted);margin:12px 0 5px}
input.in,textarea.in{width:100%;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;color:var(--fg);background:var(--glass-lo);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--line);outline:none}
input.in:focus,textarea.in:focus{box-shadow:inset 0 0 0 2px var(--tank)}
textarea.in{min-height:76px;resize:vertical}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--poison-bg);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--poison)}
.toggle b{font-family:var(--display);font-size:18px}

/* record card */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:10px 0}
.kv dt{color:var(--faint)}.kv dd{margin:0;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px;border-radius:999px;padding:2px 11px;background:var(--glass-lo);color:var(--muted);box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--rim2)}
.pill.bad{background:var(--poison-bg);color:var(--poison)}
.pill.warn{background:var(--caution-bg);color:var(--caution)}
.pill.ok{background:var(--go-soft);color:var(--go)}
.pill.info{background:var(--tank-soft);color:var(--tank-deep)}
.head{display:flex;gap:12px;align-items:center;margin-top:2px}
.head .ic{flex:0 0 48px;height:48px;border-radius:15px;display:grid;place-items:center}
.head .ic svg{width:28px;height:28px}
.note{border-radius:16px;padding:10px 12px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--line);margin:10px 0;white-space:pre-wrap}

/* placing mode */
.cross{position:fixed;left:50%;top:50%;z-index:450;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;display:none}
.cross svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
body.placing .cross{display:block}
body.placing .add,body.placing .fabs .hide-place,body.placing .chips,body.placing .mlbar,body.placing .seg{display:none}
.placebar{position:fixed;left:0;right:0;bottom:0;z-index:600;padding:0 12px calc(12px + var(--safe-b));display:none}
body.placing .placebar{display:block}
.placebar .glass{max-width:640px;margin:0 auto;border-radius:24px;padding:12px}
.gps{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gps .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.gps .lbl{font-size:13.5px;color:var(--muted);line-height:1.25}
.meter{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--poison),#ffb020 45%,var(--go2));transition:width .4s var(--ease)}
.near{font-size:14.5px;color:var(--muted);margin:-2px 0 10px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--safe-t));z-index:600;display:none;border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
body.placing .hint{display:block}

/* markers */
.pin{width:34px;height:44px;position:relative}
.pin svg{width:34px;height:44px;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.pin.issue::before{content:"";position:absolute;left:5px;top:5px;width:24px;height:24px;border-radius:50%;background:currentColor;opacity:.55;animation:pulse 2s ease-out infinite}
.pin.pending{opacity:.75}
.pin.pending svg{animation:bob 1.2s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
.lbl-tip{background:rgba(6,18,27,.72);color:#fff;border:0;border-radius:6px;padding:1px 5px;font-family:var(--display);font-weight:600;font-size:12.5px;box-shadow:none}
.lbl-tip::before{display:none}
.lbl-tip.plan{color:#ffe9a8}

.toast{position:fixed;left:50%;top:calc(126px + var(--safe-t));transform:translate(-50%,-14px);z-index:1000;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.list{display:grid;gap:6px}
.li{border:0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--glass-lo);box-shadow:inset 0 0 0 1px var(--line)}
.li .ic{flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center}
.li .ic svg{width:18px;height:18px}
.li b{font-family:var(--display);font-size:17.5px;font-weight:700;display:block;line-height:1.1}
.li small{color:var(--faint);font-size:13px}
.li .r{margin-left:auto;font-family:var(--display);font-weight:700;color:var(--faint)}
table.lay{width:100%;border-collapse:collapse;font-size:15px}
table.lay td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lay td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
/* mode switch (hardware / mainline) */
.row2{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto;padding-top:9px}
.row2 .chips{flex:1;min-width:0;margin:0;padding:0 2px 6px}
.seg{flex:0 0 auto;display:flex;gap:2px;padding:3px;border-radius:999px;margin-bottom:6px}
.seg button{border:0;cursor:pointer;border-radius:999px;padding:6px 13px;font-family:var(--display);font-weight:800;font-size:16.5px;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--tank);color:#fff;box-shadow:0 6px 14px -8px var(--tank)}
body.ml .add{display:none}
body:not(.ml) .mlbar{display:none}

/* mainline */
.mlbar{position:fixed;left:0;right:0;bottom:0;z-index:520;padding:0 12px calc(12px + var(--safe-b));pointer-events:none}
.mlbar>.glass{pointer-events:auto;max-width:640px;margin:0 auto;border-radius:24px;padding:12px}
.mlbar .st{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.mlbar .st .dot{flex:0 0 14px;height:14px;border-radius:50%;margin-top:5px}
.mlbar .st b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;display:block}
.mlbar .st small{display:block;color:var(--muted);font-size:14px;line-height:1.3;margin-top:2px}
body.ml .fabs{bottom:calc(150px + var(--safe-b))}
body.ml.mledit .fabs{bottom:calc(178px + var(--safe-b))}
.mlpipe{stroke-linecap:round;stroke-linejoin:round}
.mlflow{stroke-linecap:round;stroke-dasharray:1 13;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.vlv{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);font-family:var(--display);font-weight:800;font-size:11px;color:#fff;line-height:1}
.vlv.iv{width:17px;height:17px;border-width:2px;font-size:0}
.vlv.shut{background:#ff3b30!important;border-color:#fff}
.vlv.shut::after{content:"✕";font-size:13px}
.vlv.iv.shut::after{font-size:10px}
.vlv{position:relative}
.vlv.bad{box-shadow:0 0 0 3px #ffb020,0 2px 6px rgba(0,0,0,.5)}
.vlv.bad::before{content:"";position:absolute;right:-6px;top:-6px;width:11px;height:11px;border-radius:50%;background:#ffb020;border:2px solid #fff}
.vlv.sel.bad{box-shadow:0 0 0 3px #ffb020,0 0 0 6px var(--tank),0 2px 6px rgba(0,0,0,.5)}
.vlv.hit{animation:hit 1.1s ease-in-out infinite}
@keyframes hit{50%{box-shadow:0 0 0 7px rgba(255,59,48,.45),0 2px 6px rgba(0,0,0,.5)}}
.vlv.sel{box-shadow:0 0 0 4px var(--tank),0 2px 6px rgba(0,0,0,.5)}
.pump{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#0a84ff;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.55)}
.pump svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.jn{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #0a84ff;box-shadow:0 1px 3px rgba(0,0,0,.5)}

<script>
(function(){
"use strict";
/* ---------- config ---------- */

var QS=new URLSearchParams(location.search);
var TEST=QS.get("test")==="1";
var CREW=[["Andy Anderson","U06BCCG4HT9"],["Ben Hartley","U06NBNSR9LG"],["Neil Harper","U06FJ0J1RH8"],["Kyle Craig","U06FWK6ND5X"],["Nathan Drew","U06FJ0J5DS6"],["Nathan Ferguson","U06H9J0LBEC"],["Brodie Macdonald","U0839HLQA8G"],["Nicholas Debrincat","U07QSB7MDK5"],["Flynn Sinclair","U08C1SVFSFR"],["James King","U08D57N6JSC"],["Joshua Cope","U08ENB28AQZ"],["Mitch Mahoney","U08K55E3QJU"],["Samuel Cope","U09LN1Q8QH2"],["Tremayne Gallagher","U09V6AVPUDP"],["Michael K","U07QSB7HVM1"]];
var CIRRUS_SMALL=200; /* Cirrus Pro calls a layer Small under 200 points */

/* ---------- icons ---------- */
var G={

  grate:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M12 4v16M16 4v16"/>',
  box:'<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 10h17"/>',
  head:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  bang:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  valve:'<path d="M4 17h16"/><path d="M7 17V9l5 4 5-4v8"/><path d="M12 13V5M9 5h6"/>',

  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
  air:'<path d="M5 9h9a3 3 0 1 0-3-3"/><path d="M3 13h14a3 3 0 1 1-3 3"/><path d="M4 17h5"/>',
  outlet:'<path d="M3 8h10a4 4 0 0 1 4 4v1"/><path d="M3 14h7"/><path d="M17 16c0 1.5 1 3 2 4M15 17c0 1.4-.6 2.6-1.4 3.5M19.5 14.5c.6 1 .9 2 .9 3"/>',
  co:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',

};
function svg(g,col,sw){return '<svg viewBox="0 0 24 24" style="stroke:'+(col||'currentColor')+';fill:none;stroke-width:'+(sw||2)+';stroke-linecap:round;stroke-linejoin:round">'+G[g]+'</svg>'}

/* ---------- types ---------- */

var T={

  headfault:{cat:"issue",fam:"irr",name:"Head fault",hint:"Stuck on, won't pop, broken, wrong arc",g:"head",col:"#ff3b30"},
  box:{cat:"issue",fam:"irr",name:"Broken or sunken box",hint:"Lid gone, cracked, trip hazard",g:"box",col:"#ff3b30"},
  other_irr:{cat:"issue",fam:"irr",name:"Other irrigation",hint:"Anything else for #irrigation",g:"bang",col:"#ff3b30"},
  wet:{cat:"issue",fam:"drn",name:"Wet or boggy spot",hint:"Not draining, standing water",g:"wave",col:"#ff9f0a"},
  blocked:{cat:"issue",fam:"drn",name:"Blocked or slow drain",hint:"Pit full, grate blocked, outlet not running",g:"grate",col:"#ff9f0a"},
  other_drn:{cat:"issue",fam:"drn",name:"Other drainage",hint:"Anything else for #drainage",g:"bang",col:"#ff9f0a"},
  iv:{cat:"asset",fam:"irr",name:"Isolation valve",plural:"Isolation valves",plan:"iv",g:"valve",col:"#30d158",valve:true},
  sv:{cat:"asset",fam:"irr",name:"Sluice valve",plural:"Sluice valves",plan:"sv",g:"valve",col:"#0a84ff",valve:true},
  mv:{cat:"asset",fam:"irr",name:"MV valve",plural:"MV valves",hint:"Marked MV on the 2000 as-built",plan:"mv",g:"valve",col:"#8e8cff",valve:true},
  qcv:{cat:"asset",fam:"irr",name:"Quick coupler (QCV)",plural:"Quick couplers",g:"qcv",col:"#64d2ff",valve:true},
  vbox:{cat:"asset",fam:"irr",name:"Valve box",plural:"Valve boxes",g:"box",col:"#d9a75f"},
  head:{cat:"asset",fam:"irr",name:"Sprinkler head",plural:"Sprinkler heads",hint:"True GPS spot of a head",g:"head",col:"#f2f2f7"},
  dec:{cat:"asset",fam:"irr",name:"Decoder or splice",plural:"Decoders and splices",g:"chip",col:"#bf5af2"},
  air:{cat:"asset",fam:"irr",name:"Air valve",plural:"Air valves",g:"air",col:"#5ad8cf",valve:true},
  dp:{cat:"asset",fam:"drn",name:"Drain pit",plural:"Drain pits",plan:"dp",g:"grate",col:"#ffd60a"},
  do:{cat:"asset",fam:"drn",name:"Drain outlet",plural:"Drain outlets",plan:"do",g:"outlet",col:"#ffb340"},
  co:{cat:"asset",fam:"drn",name:"Cleanout or flush point",plural:"Cleanouts and flush points",g:"co",col:"#e6d18a"},
  other_hw:{cat:"asset",fam:"irr",name:"Other hardware",plural:"Other hardware",g:"dot",col:"#c7c7cc"}
};
var ISSUES=["leak","headfault","box","other_irr","wet","blocked","other_drn"];
var ASSETS=["iv","sv","mv","qcv","vbox","head","dec","air","dp","do","co","other_hw"];
var PLAN={iv:{name:"LI-IV",desc:"lateral isolation valve",type:"iv",col:"#30d158"},sv:{name:"SV",desc:"sluice valve",type:"sv",col:"#0a84ff"},mv:{name:"MV",desc:"marked MV",type:"mv",col:"#8e8cff"},dp:{name:"DP",desc:"drain pit",type:"dp",col:"#ffd60a"},do:{name:"DO",desc:"drain outlet",type:"do",col:"#ffb340"}};
var COND={good:["Works fine","ok"],work:["Needs work","warn"],fail:["Failed","bad"]};
var AREA={F:"fairway",G:"green",T:"tee",A:"approach",S:"surrounds",P:"green surrounds",R:"rough",M:"",D:"driving range",O:"practice putting green",HPPG:"Himalayan putting green",N:"chipping green",C:"chipping area"};

/* ---------- small helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x==null?null:JSON.parse(x)}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var R=6371008.8;
function dist(a,b){var p=Math.PI/180,dlat=(b[0]-a[0])*p,dlng=(b[1]-a[1])*p*Math.cos((a[0]+b[0])/2*p);return R*Math.sqrt(dlat*dlat+dlng*dlng)}
function bearing(a,b){var p=Math.PI/180,y=(b[1]-a[1])*Math.cos((a[0]+b[0])/2*p),x=b[0]-a[0];var d=(Math.atan2(y,x)/p+360)%360;return ["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]}
function fmtM(m){return m<10?m.toFixed(1)+" m":Math.round(m)+" m"}
function when(iso){if(!iso)return "";var d=new Date(iso);if(isNaN(d))return "";var now=new Date();var t=d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}).replace(/\s/g,"").toLowerCase();var same=d.toDateString()===now.toDateString();var y=new Date(now.getTime()-864e5);if(same)return "today "+t;if(d.toDateString()===y.toDateString())return "yesterday "+t;return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+" "+t}
function newId(){var n=Math.floor(Date.now()/1000)-1767225600;var s=n.toString(36).toUpperCase();var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return "PIN-"+s.slice(-5)+a[Math.floor(Math.random()*a.length)]}
function evId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var toastT;function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},3200)}

/* ---------- data ---------- */
var REF={heads:[],plan:[],noGps:[]};
var LIVE={records:[]};
var LOCAL=ls("hw.local")||{};   /* id -> {rec, ev} records changed on this phone and not yet in live.json */
var HEADS=[];                    /* [{n,lat,lng,hole,area}] */
function parseHead(n){var m=/^(\d+)([A-Z]+)(\d+)/.exec(n);if(!m)return {hole:null,area:""};return {hole:+m[1],area:m[2]}}
function placeOf(h){if(!h)return "";var a=AREA[h.area];if(h.hole===19)return a||"practice area";if(!h.hole)return "";return ord(h.hole)+(a?" "+a:"")}
function nearestHeads(ll,k){var out=[];for(var i=0;i<HEADS.length;i++){var h=HEADS[i];out.push([dist(ll,[h.lat,h.lng]),h])}out.sort(function(a,b){return a[0]-b[0]});return out.slice(0,k||1)}
function nearText(ll){var n=nearestHeads(ll,1)[0];if(!n||n[0]>120)return {text:"",hole:null,place:""};var h=n[1];return {text:"near "+h.n+" ("+fmtM(n[0])+" "+bearing([h.lat,h.lng],ll)+")",hole:h.hole===19?null:h.hole,place:placeOf(h),head:h.n,d:n[0]}}
function nearestPlan(ll,planType,max){var best=null;REF.plan.forEach(function(p){if(planType&&p[1]!==planType)return;var d=dist(ll,[p[2],p[3]]);if(d<=(max||25)&&(!best||d<best[0]))best=[d,p]});return best}

function records(){
  var by={};
  (LIVE.records||[]).forEach(function(r){if(r.test&&!TEST)return;by[r.id]=r});
  Object.keys(LOCAL).forEach(function(id){var L=LOCAL[id];var live=by[id];
    if(live&&live.evs&&live.evs.indexOf(L.ev)>=0){delete LOCAL[id];return}
    by[id]=Object.assign({},live||{},L.rec,{_pending:true})});
  ls("hw.local",LOCAL);
  return Object.keys(by).map(function(k){return by[k]}).filter(function(r){return r.status!=="removed"});
}

/* ---------- map ---------- */
var map=L.map("map",{zoomControl:false,attributionControl:true,maxZoom:22,minZoom:14,preferCanvas:true,zoomSnap:.25,wheelPxPerZoomLevel:90});
/* aerials: MetroMap Jan 2026 (the CirrusPRO backdrop, cut into tiles in tiles/mm) over Esri, which fills in past its edges */
var MMB=L.latLngBounds([-38.1249177,145.237944],[-38.1165969,145.2511051]);
var esri=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:19,maxZoom:22,attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics",crossOrigin:true,keepBuffer:3}).addTo(map);
var metro=L.tileLayer("tiles/mm/{z}/{x}/{y}.webp",{minZoom:14,maxNativeZoom:19,maxZoom:22,bounds:MMB,keepBuffer:3,attribution:"Aerial &copy; MetroMap Jan 2026"});
if(ls("hw.aerial")!=="esri")metro.addTo(map);
/* the 2000 irrigation as-built drawing (CirrusPRO layer) for checking and tracing the mainline */
var planLayer=L.tileLayer("tiles/plan/{z}/{x}/{y}.webp",{minZoom:15,maxNativeZoom:19,maxZoom:22,bounds:L.latLngBounds([-38.1242095,145.2379596],[-38.116943,145.2511068]),opacity:.85,zIndex:5});
var COURSE=L.latLngBounds([-38.1238,145.2378],[-38.1171,145.2507]);
map.fitBounds(COURSE,{padding:[0,0]});
var canvas=L.canvas({padding:.4,tolerance:6});
var LG={heads:L.layerGroup(),plan:L.layerGroup(),issues:L.layerGroup(),assets:L.layerGroup(),fixed:L.layerGroup(),me:L.layerGroup().addTo(map),tmp:L.layerGroup().addTo(map)};
var SHOW=Object.assign({issues:true,assets:true,plan:true,heads:true,fixed:false},ls("hw.show")||{});delete SHOW.lines;
var labelLayer=L.layerGroup().addTo(map);

function buildRef(){
  LG.heads.clearLayers();
  HEADS.forEach(function(h){
    var m=L.circleMarker([h.lat,h.lng],{renderer:canvas,radius:3.2,weight:1.2,color:"#0b2231",fillColor:"#ffffff",fillOpacity:.9,opacity:.75});
    m.on("click",function(){openHead(h)});m.addTo(LG.heads);
  });
  LG.plan.clearLayers();
  REF.plan.forEach(function(p){
    var P=PLAN[p[1]];if(!P)return;
    var m=L.circleMarker([p[2],p[3]],{renderer:canvas,radius:5,weight:1.8,color:P.col,opacity:.9,fillColor:P.col,fillOpacity:.18});
    m.on("click",function(){openPlan(p)});m.addTo(LG.plan);
  });
  applyShow();
}

function pinIcon(r){
  var t=T[r.type]||T.other_hw;var col=t.col;var issue=t.cat==="issue"&&r.status!=="fixed";
  var fill=r.status==="fixed"?"#8e8e93":col;var ink=(t.cat==="asset"&&(r.type==="head"||r.type==="dp"||r.type==="co"||r.type==="do"||r.type==="vbox"||r.type==="qcv"||r.type==="air"||r.type==="other_hw"))?"#0b2231":"#ffffff";
  var ring=r.cond==="fail"?"#ff3b30":r.cond==="work"?"#ff9f0a":"#ffffff";
  var html='<div class="pin'+(issue?" issue":"")+(r._pending?" pending":"")+'" style="color:'+fill+'"><svg viewBox="0 0 34 44"><path d="M17 43C17 43 3 27.5 3 17a14 14 0 0 1 28 0c0 10.5-14 26-14 26z" fill="'+fill+'" stroke="'+ring+'" stroke-width="'+(ring==="#ffffff"?2:3.2)+'"/><g transform="translate(7.4 7.2) scale(.8)" style="stroke:'+ink+';fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">'+(r.status==="fixed"?G.tick:G[t.g])+'</g></svg></div>';
  return L.divIcon({html:html,className:"",iconSize:[34,44],iconAnchor:[17,43]});
}
var MARK={};
function drawRecords(){
  LG.issues.clearLayers();LG.assets.clearLayers();LG.fixed.clearLayers();MARK={};
  var recs=records();
  recs.forEach(function(r){
    if(r.lat==null||r.lng==null)return;
    var t=T[r.type]||T.other_hw;
    var grp=t.cat==="issue"?(r.status==="fixed"?LG.fixed:LG.issues):LG.assets;
    var m=L.marker([r.lat,r.lng],{icon:pinIcon(r),zIndexOffset:t.cat==="issue"?1000:500,keyboard:false});
    m.on("click",function(){openRecord(r.id)});m.addTo(grp);MARK[r.id]=m;
  });
  counts(recs);
}
function counts(recs){
  if(MODE==="ml"){mlCounts();return}
  recs=recs||records();
  var open=recs.filter(function(r){return (T[r.type]||{}).cat==="issue"&&r.status!=="fixed"}).length;
  var fixed=recs.filter(function(r){return (T[r.type]||{}).cat==="issue"&&r.status==="fixed"}).length;
  var assets=recs.filter(function(r){return (T[r.type]||{}).cat==="asset"}).length;
  $("#sub").textContent=(open?open+" open problem"+(open===1?"":"s"):"No open problems")+" · "+assets+" hardware pinned"+(TEST?" · TEST":"");
  var C=[["issues","Problems",open,"#ff3b30"],["assets","Hardware",assets,"#30d158"],["plan","As-built",REF.plan.length,"#ffd60a"],["heads","Heads",HEADS.length,"#ffffff"],["fixed","Fixed",fixed,"#8e8e93"]];
  $("#chips").innerHTML=C.map(function(c){return '<button class="chip glass'+(SHOW[c[0]]?"":" off")+'" data-k="'+c[0]+'"><span class="dot" style="background:'+c[3]+'"></span>'+c[1]+(c[2]!==""?' <span class="n">'+c[2]+'</span>':'')+'</button>'}).join("");
}
$("#chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;var k=b.dataset.k;
  if(MODE==="ml"){MSHOW[k]=!MSHOW[k];ls("ml.show",MSHOW);applyShow();counts();return}
  SHOW[k]=!SHOW[k];ls("hw.show",SHOW);applyShow();counts()});
function applyShow(){
  var z=map.getZoom();
  if(MODE==="ml"){["issues","assets","fixed","heads","plan"].forEach(function(k){map.removeLayer(LG[k])});labelLayer.clearLayers();mlApply();return}
  ["issues","assets","fixed"].forEach(function(k){if(SHOW[k])LG[k].addTo(map);else map.removeLayer(LG[k])});
  if(SHOW.heads&&z>=16.5)LG.heads.addTo(map);else map.removeLayer(LG.heads);
  if(SHOW.plan&&z>=17)LG.plan.addTo(map);else map.removeLayer(LG.plan);
  labels();
}
/* names on heads and plan points once zoomed right in, only for what's on screen */
function labels(){
  labelLayer.clearLayers();var z=map.getZoom();if(z<19)return;var b=map.getBounds().pad(.05);var n=0;
  if(SHOW.heads)HEADS.forEach(function(h){if(n>140||!b.contains([h.lat,h.lng]))return;n++;L.tooltip({permanent:true,direction:"right",offset:[5,0],className:"lbl-tip",interactive:false}).setLatLng([h.lat,h.lng]).setContent(h.n).addTo(labelLayer)});
  if(SHOW.plan)REF.plan.forEach(function(p){if(n>200||!b.contains([p[2],p[3]]))return;n++;L.tooltip({permanent:true,direction:"left",offset:[-7,0],className:"lbl-tip plan",interactive:false}).setLatLng([p[2],p[3]]).setContent(p[0]).addTo(labelLayer)});
}
map.on("zoomend moveend",function(){applyShow()});

/* ---------- my location ---------- */
var watch=null,meDot=null,meAcc=null,lastFix=null;
function startWatch(){
  if(!navigator.geolocation){toast("This phone can't share its location");return}
  if(watch!=null)return;
  watch=navigator.geolocation.watchPosition(function(p){
    lastFix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    var ll=[lastFix.lat,lastFix.lng];
    if(!meDot){meAcc=L.circle(ll,{radius:lastFix.acc,color:"#0a84ff",weight:1,fillOpacity:.12,interactive:false}).addTo(LG.me);meDot=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#0a84ff",fillOpacity:1,interactive:false}).addTo(LG.me)}

  L.items.map(function(r){return '<Placemark><name>'+xesc(tip(r))+'</name><styleUrl>#s</styleUrl><Point><coordinates>'+r.lng.toFixed(7)+','+r.lat.toFixed(7)+',0</coordinates></Point></Placemark>'}).join("\n")+'\n</Document></kml>\n'}
function csv(recs){var cols=["id","type","label","ref","cond","size","depth","status","lat","lng","acc","fixes","place","near","notes","by","at","fixed_by","fixed_at","fix_notes"];
  var q=function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return cols.join(",")+"\n"+recs.map(function(r){return cols.map(function(c){return q(c==="type"?T[r.type].name:r[c])}).join(",")}).join("\n")+"\n"}
function geojson(recs){return {type:"FeatureCollection",features:recs.map(function(r){var p=Object.assign({},r);delete p.lat;delete p.lng;delete p.evs;delete p._pending;p.type_name=T[r.type].name;return {type:"Feature",geometry:{type:"Point",coordinates:[r.lng,r.lat]},properties:p}})}}
function download(name,text,type){var b=new Blob([text],{type:type});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- mainline: pipes, valves, water simulation, isolation finder, editing ----------
   network.json: nodes {id,k,lat,lng,ref?,name?,cond?,note?} (k: src pump, j junction, end, sv sluice valve, mv MV valve,
   iv lateral isolation valve on a stub off the main, ov other valve), pipes {id,a,b,pts[[lat,lng]..],mm?,run?,stub?},
   feeds {head: nodeId} (heads linked to a valve; the rest feed off the nearest main), log [{at,by,note}].
   The page is the only editor: Save posts the whole file to the hook ("net"), which commits it. */
var MODE=ls("hw.mode")==="ml"?"ml":"hw";
var NET=null,NETBASE=null,NI={},ADJ={},HEADFEED=null;
var ML={closed:{},edit:false,undo:[],tool:null,ops:[],sel:null,hit:{},target:null,saving:null};
var MSHOW=Object.assign({valves:true,iv:true,heads:true,plan:false},ls("ml.show")||{});
var svgR=L.svg({padding:.5});
var LGM={pipes:L.layerGroup(),valves:L.layerGroup(),heads:L.layerGroup(),edit:L.layerGroup(),draw:L.layerGroup()};
var VALVE={sv:{name:"Sluice valve",short:"SV",col:"#0a84ff"},mv:{name:"MV valve",short:"MV",col:"#8e8cff"},iv:{name:"Lateral isolation valve",short:"LI-IV",col:"#30d158"},ov:{name:"Other valve",short:"V",col:"#5ad8cf"}};
var NETFILE=TEST?"network.test.json":"network.json";
function isValve(n){return !!(n&&VALVE[n.k])}
function vname(n){if(!n)return "";if(n.k==="src")return n.name||"Pump";if(isValve(n))return n.ref||n.name||VALVE[n.k].short;return n.k==="end"?"Pipe end":"Junction"}
function m2(a,b){return dist(a,b)}
function plen(p){var c=pipeLL(p),s=0;for(var i=1;i<c.length;i++)s+=m2(c[i-1],c[i]);return s}
function pipeLL(p){return [[NI[p.a].lat,NI[p.a].lng]].concat(p.pts||[],[[NI[p.b].lat,NI[p.b].lng]])}
function netIndex(){NI={};ADJ={};NET.nodes.forEach(function(n){NI[n.id]=n});NET.pipes.forEach(function(p){(ADJ[p.a]=ADJ[p.a]||[]).push(p);(ADJ[p.b]=ADJ[p.b]||[]).push(p)});HEADFEED=null;NET.feeds=NET.feeds||{};NET.log=NET.log||[]}
function nextId(pre,arr){var m=0;arr.forEach(function(x){var v=+String(x.id).slice(1);if(v>m)m=v});return pre+(m+1)}
/* local metres around the course, for nearest-pipe sums */
var K0=Math.cos(-38.12*Math.PI/180);
function xy(ll){return [ll[1]*111320*K0,ll[0]*110574]}
function projSeg(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-9;var t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2));var q=[a[0]+t*dx,a[1]+t*dy];return {t:t,q:q,d:Math.hypot(q[0]-p[0],q[1]-p[1])}}
function nearestPipe(ll,opt){opt=opt||{};var P=xy(ll),best=null;
  NET.pipes.forEach(function(p){if(opt.noStub&&p.stub)return;var c=pipeLL(p).map(xy);for(var i=1;i<c.length;i++){var r=projSeg(P,c[i-1],c[i]);if(!best||r.d<best.d)best={p:p,i:i-1,t:r.t,d:r.d,q:r.q}}});
  if(best){best.ll=[best.q[1]/110574,best.q[0]/(111320*K0)]}return best}
function headFeeds(){if(HEADFEED)return HEADFEED;HEADFEED={};HEADS.forEach(function(h){var f=NET.feeds[h.n];if(f&&NI[f]){HEADFEED[h.n]={node:f};return}var np=nearestPipe([h.lat,h.lng],{noStub:true});HEADFEED[h.n]=np?{pipe:np.p.id,d:np.d}:{}});return HEADFEED}

/* ---- water: Dijkstra from the pump(s) through open nodes ---- */
function simulate(closed){
  closed=closed||ML.closed;var d={},wet={},done={},list=[];
  NET.nodes.forEach(function(n){if(n.k==="src"){d[n.id]=0;list.push(n.id)}});
  while(list.length){var bi=0;for(var i=1;i<list.length;i++)if(d[list[i]]<d[list[bi]])bi=i;var u=list.splice(bi,1)[0];if(done[u])continue;done[u]=1;wet[u]=1;if(closed[u])continue;
    (ADJ[u]||[]).forEach(function(p){var v=p.a===u?p.b:p.a;var nd=d[u]+(p._len||(p._len=plen(p)));if(d[v]==null||nd<d[v]){d[v]=nd;list.push(v)}})}
  var pw={};NET.pipes.forEach(function(p){pw[p.id]=(wet[p.a]&&!closed[p.a])||(wet[p.b]&&!closed[p.b])});
  var hf=headFeeds(),hd={};HEADS.forEach(function(h){var f=hf[h.n];var ok=f.node?(wet[f.node]&&!closed[f.node]):f.pipe?pw[f.pipe]:true;if(!ok)hd[h.n]=1});
  return {d:d,wet:wet,pw:pw,dry:hd};
}
function dryText(dry,max){var g={},order=[];Object.keys(dry).forEach(function(n){var h=HEADS.filter(function(x){return x.n===n})[0];if(!h)return;var k=placeOf(h)||"Other";if(!g[k]){g[k]=0;order.push(k)}g[k]++});
  order.sort(function(a,b){var ha=parseInt(a)||99,hb=parseInt(b)||99;return ha-hb||a.localeCompare(b)});
  var parts=order.map(function(k){return k+" ("+g[k]+")"});return {n:Object.keys(dry).length,groups:order.length,text:parts.slice(0,max||99).join(", ")+(parts.length>(max||99)?" and "+(parts.length-max)+" more":""),list:order.map(function(k){return [k,g[k]]})}}

/* valves the crew have logged as failed on the hardware map count as seized */
function hwValve(n){if(!isValve(n))return null;var best=null;records().forEach(function(r){var t=T[r.type];if(!t||!t.valve||t.cat!=="asset")return;var d=dist([n.lat,n.lng],[r.lat,r.lng]);if((n.ref&&r.ref===n.ref)||d<=6){if(!best||(r.at||"")>(best.at||""))best=r}});return best}
function seized(n){if(!isValve(n))return false;if(n.cond==="fail")return true;var r=hwValve(n);return !!(r&&r.cond==="fail")}

/* ---- isolation finder: the ring of working valves around a pipe or a valve's lateral ---- */
function enclose(target){
  var bound={},seen={},stack=[],passed=[];
  function push(u){if(!seen[u])stack.push(u)}
  if(target.node){var n0=NI[target.node];if(isValve(n0)&&!seized(n0))return {valves:[target.node],passed:[]};push(target.node)}
  else{var p0=NET.pipes.filter(function(p){return p.id===target.pipe})[0];if(!p0)return {fail:"nopipe"};
    [p0.a,p0.b].forEach(function(e){var n=NI[e];if(isValve(n)&&!seized(n)&&(ADJ[e]||[]).length>1){bound[e]=1;seen[e]=1}else push(e)})}
  while(stack.length){var u=stack.pop();if(seen[u])continue;seen[u]=1;var n=NI[u];
    if(n.k==="src")return {fail:"pump",passed:passed};
    var deg=(ADJ[u]||[]).length;
    if(isValve(n)&&deg>1&&!(target.node===u)){if(seized(n))passed.push(u);else{bound[u]=1;continue}}
    (ADJ[u]||[]).forEach(function(p){push(p.a===u?p.b:p.a)})}
  return {valves:Object.keys(bound),passed:passed};
}

/* ---- drawing ---- */
function vIcon(n){var V=VALVE[n.k];var cls="vlv "+n.k+(ML.closed[n.id]?" shut":"")+(seized(n)?" bad":"")+(ML.hit[n.id]?" hit":"")+(ML.sel===n.id?" sel":"");
  return L.divIcon({className:"",html:'<div class="'+cls+'" style="background:'+V.col+'">'+(n.k==="iv"||ML.closed[n.id]?"":V.short)+'</div>',iconSize:n.k==="iv"?[17,17]:[24,24],iconAnchor:n.k==="iv"?[8.5,8.5]:[12,12]})}
var PUMPI='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5v14M5 12h14"/></svg>';
var SIM=null;
function drawNet(){
  LGM.pipes.clearLayers();LGM.valves.clearLayers();LGM.edit.clearLayers();if(!NET)return;
  SIM=simulate();var z=map.getZoom();ML.zb=zBucket();var w=z>=18?5:z>=16.5?4:3;
  NET.pipes.forEach(function(p){
    var ll=pipeLL(p);var wet=SIM.pw[p.id];
    if(wet){var da=SIM.d[p.a],db=SIM.d[p.b];var fa=ML.closed[p.a]?Infinity:da,fb=ML.closed[p.b]?Infinity:db;if(fb<fa)ll=ll.slice().reverse()}
    var hit=ML.target&&ML.target.pipe===p.id;
    var base=L.polyline(ll,{renderer:svgR,color:wet?(p.stub?"#1d8a4a":"#0569a0"):"#5b6670",weight:(p.stub?w-1:w)+3,opacity:wet?.9:.75,className:"mlpipe",interactive:true,bubblingMouseEvents:false});
    base.on("click",function(e){L.DomEvent.stop(e);onPipe(p,e.latlng)});base.addTo(LGM.pipes);
    if(hit)L.polyline(ll,{renderer:svgR,color:"#ffcc00",weight:w+7,opacity:.55,interactive:false}).addTo(LGM.pipes);
    L.polyline(ll,{renderer:svgR,color:wet?"#9be7ff":"#c4ccd2",weight:p.stub?w-2:w-1,opacity:wet?1:.8,dashArray:wet?null:"5 6",className:"mlpipe",interactive:false}).addTo(LGM.pipes);
    if(wet&&!ML.edit&&!p.stub)L.polyline(ll,{renderer:svgR,color:"#ffffff",weight:w-1,opacity:.95,className:"mlflow",interactive:false}).addTo(LGM.pipes);
  });
  NET.nodes.forEach(function(n){
    if(n.k==="src"){var pm=L.marker([n.lat,n.lng],{icon:L.divIcon({className:"",html:'<div class="pump">'+PUMPI+'</div>',iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:900,draggable:ML.edit,keyboard:false});pm.on("click",function(){onNode(n)});pm.on("dragend",function(e){moveNode(n,e.target.getLatLng())});pm.addTo(LGM.valves);return}
    if(isValve(n)){if(n.k==="iv"?!MSHOW.iv:!MSHOW.valves){if(!ML.closed[n.id]&&!ML.hit[n.id])return}
      if(n.k==="iv"&&z<16.5&&!ML.closed[n.id]&&!ML.hit[n.id])return;
      var m=L.marker([n.lat,n.lng],{icon:vIcon(n),zIndexOffset:n.k==="iv"?600:800,draggable:ML.edit,keyboard:false});
      m.on("click",function(){onNode(n)});m.on("dragend",function(e){moveNode(n,e.target.getLatLng())});m.addTo(LGM.valves);return}
    if(ML.edit&&z>=17){var j=L.marker([n.lat,n.lng],{icon:L.divIcon({className:"",html:'<div class="jn"></div>',iconSize:[12,12],iconAnchor:[6,6]}),draggable:true,zIndexOffset:400,keyboard:false});j.on("click",function(){onNode(n)});j.on("dragend",function(e){moveNode(n,e.target.getLatLng())});j.addTo(LGM.edit)}
  });
  drawMlHeads();mlBar();mlCounts();
}
function drawMlHeads(){
  LGM.heads.clearLayers();if(!NET||!MSHOW.heads)return;var z=map.getZoom();var dry=SIM?SIM.dry:{};var any=Object.keys(dry).length;
  if(z<16.5&&!any)return;
  var linking=ML.tool&&ML.tool.k==="link";
  HEADS.forEach(function(h){var isDry=!!dry[h.n];if(z<16.5&&!isDry)return;
    var linked=linking&&NET.feeds[h.n]===ML.tool.valve;
    var m=L.circleMarker([h.lat,h.lng],{renderer:canvas,radius:linked?6:isDry?5:3.4,weight:linked?2.5:1.3,color:linked?"#30d158":isDry?"#fff":"#0b2231",fillColor:linked?"#30d158":isDry?"#ff3b30":"#e9f8ff",fillOpacity:.95,opacity:.9});
    m.on("click",function(e){L.DomEvent.stop(e);onHead(h)});m.addTo(LGM.heads)});
}
function mlLabels(){
  labelLayer.clearLayers();if(map.getZoom()<18.5||!NET)return;var b=map.getBounds().pad(.05);var n=0;
  NET.nodes.forEach(function(v){if(!isValve(v)||n>120||!b.contains([v.lat,v.lng]))return;if(v.k==="iv"?!MSHOW.iv:!MSHOW.valves)return;n++;L.tooltip({permanent:true,direction:"right",offset:[10,0],className:"lbl-tip plan",interactive:false}).setLatLng([v.lat,v.lng]).setContent(esc(vname(v))).addTo(labelLayer)});
  if(MSHOW.heads&&map.getZoom()>=19.5)HEADS.forEach(function(h){if(n>220||!b.contains([h.lat,h.lng]))return;n++;L.tooltip({permanent:true,direction:"left",offset:[-6,0],className:"lbl-tip",interactive:false}).setLatLng([h.lat,h.lng]).setContent(h.n).addTo(labelLayer)});
}
function zBucket(){var z=map.getZoom();return z<16.5?0:z<17?1:z<18?2:3}
function mlApply(force){
  var on=MODE==="ml";
  ["pipes","valves","heads","edit","draw"].forEach(function(k){if(on)LGM[k].addTo(map);else map.removeLayer(LGM[k])});
  if(on&&(MSHOW.plan||ML.edit))planLayer.addTo(map);else map.removeLayer(planLayer);
  if(on){var zb=zBucket();if(force||zb!==ML.zb)drawNet();mlLabels()}
}
function mlCounts(){
  if(MODE!=="ml")return;
  var nv=0,niv=0,km=0;if(NET){NET.nodes.forEach(function(n){if(n.k==="sv"||n.k==="mv"||n.k==="ov")nv++;if(n.k==="iv")niv++});NET.pipes.forEach(function(p){if(!p.stub)km+=p._len||(p._len=plen(p))})}
  $("#sub").textContent=NET?(km/1000).toFixed(1)+" km of main · "+nv+" sluice/MV · "+niv+" LI-IV"+(TEST?" · TEST":""):"Loading the mainline…";
  var C=[["valves","Sluice valves",nv,"#0a84ff"],["iv","LI-IVs",niv,"#30d158"],["heads","Heads",HEADS.length,"#ffffff"],["plan","2000 plan","","#d9d9d9"]];
  $("#chips").innerHTML=C.map(function(c){return '<button class="chip glass'+(MSHOW[c[0]]?"":" off")+'" data-k="'+c[0]+'"><span class="dot" style="background:'+c[3]+'"></span>'+c[1]+(c[2]!==""?' <span class="n">'+c[2]+'</span>':'')+'</button>'}).join("");
}

/* ---- the bottom panel ---- */
function mlBar(){
  if(MODE!=="ml")return;var el=$("#mlbar");if(!NET){el.innerHTML='<div class="st"><span class="dot" style="background:#8e8e93"></span><div><b>Loading the mainline…</b></div></div>';return}
  var shut=Object.keys(ML.closed);var dr=dryText(SIM?SIM.dry:{},4);var h="";
  if(ML.edit){
    var n=ML.ops.length;
    h='<div class="st"><span class="dot" style="background:#ffb020"></span><div><b>Editing the mainline'+(n?' · '+n+' change'+(n===1?'':'s'):'')+'</b><small>Drag valves and junctions to move them. Tap a pipe or valve to change it. Nothing is shared until you save.</small></div></div>'+
      '<div class="row"><button class="btn soft sm" id="eValve">Add valve</button><button class="btn soft sm" id="ePipe">Draw pipe</button>'+(ML.undo.length?'<button class="btn soft sm" id="eUndo">Undo</button>':'')+'</div><div class="row" style="margin-top:8px"><button class="btn soft sm" id="eCancel">'+(n?"Discard":"Stop editing")+'</button><button class="btn go" id="eSave" style="flex:2"'+(n?"":" disabled")+'>Save for everyone</button></div>';
  }else{
    if(!shut.length)h='<div class="st"><span class="dot" style="background:#2fd27a"></span><div><b>Water everywhere</b><small>Tap a valve to shut it, or find the valves to shut off a spot.</small></div></div>';
    else h='<div class="st"><span class="dot" style="background:#ff3b30"></span><div><b>'+shut.length+' valve'+(shut.length===1?'':'s')+' shut · '+(dr.n?dr.n+' head'+(dr.n===1?'':'s')+' off':'nothing off')+'</b><small>'+(dr.n?esc(dr.text):'Water still gets around through other pipes.')+'</small></div></div>';
    h+='<div class="row"><button class="btn go" id="mFind" style="flex:2">Find valves to shut</button>'+(shut.length?'<button class="btn soft sm" id="mOpen">Open all</button>':'')+(shut.length&&dr.n?'<button class="btn soft sm" id="mList">Details</button>':'')+'<button class="btn soft sm" id="mEdit">Edit</button></div>';
    if(ML.saving)h='<div class="opts" style="margin:-2px 0 8px"><span class="pill info">Saving the mainline…</span></div>'+h;
  }
  el.innerHTML=h;
  var b=function(id,f){var x=$(id);if(x)x.onclick=f};
  b("#mFind",function(){setTool({k:"find",txt:"Tap the head or pipe you need to work on"})});
  b("#mOpen",function(){ML.closed={};ML.hit={};ML.target=null;drawNet()});
  b("#mList",function(){shutSheet()});
  b("#mEdit",startEdit);
  b("#eValve",function(){setTool({k:"addValve",txt:"Tap the pipe where the valve is"})});
  b("#ePipe",function(){setTool({k:"pipe",txt:"Tap where the pipe starts",pts:[]})});
  b("#eUndo",undo);b("#eCancel",cancelEdit);b("#eSave",saveSheet);
}
function shutSheet(){var dr=dryText(SIM.dry);var shut=Object.keys(ML.closed).map(function(id){return NI[id]}).filter(Boolean);
  var s=sheet('<h2>What\'s shut off</h2><h3>Valves shut</h3><div class="list">'+shut.map(valveLi).join("")+'</div><h3>Heads with no water · '+dr.n+'</h3>'+(dr.n?'<table class="lay">'+dr.list.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td class="n">'+x[1]+'</td></tr>'}).join("")+'</table>':'<p class="faint">None. Water still gets around.</p>'),{peek:true});
  wireValveLi(s)}
function valveLi(n){var V=VALVE[n.k]||VALVE.ov;var nt=nearText([n.lat,n.lng]);return '<button class="li" data-v="'+n.id+'"><span class="ic" style="background:'+V.col+'22">'+svg("valve",V.col)+'</span><span><b>'+esc(vname(n))+(seized(n)?' · seized':'')+'</b><small>'+esc(V.name+" · "+((nt.place?nt.place+", ":"")+(nt.text||"")))+'</small></span></button>'}
function wireValveLi(s){s.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){var n=NI[b.dataset.v];closeSheet();map.setView([n.lat,n.lng],Math.max(map.getZoom(),19));setTimeout(function(){onNode(n)},300)}})}

/* ---- tools (one tap on the map does the next thing) ---- */
function setTool(t){ML.tool=t;var el=$("#tool");if(!t){el.classList.remove("on");LGM.draw.clearLayers();drawMlHeads();return}$("#toolTxt").textContent=t.txt;$("#toolX").textContent=t.k==="pipe"&&t.pts&&t.pts.length>1?"Finish":t.k==="pipe"?"Cancel":"Done";el.classList.add("on");if(t.k==="link")drawMlHeads()}
$("#toolX").onclick=function(){var t=ML.tool;if(t&&t.k==="pipe"&&t.pts.length>1){finishPipe();return}setTool(null)};
function screenD(a,b){var p=map.latLngToContainerPoint(a),q=map.latLngToContainerPoint(b);return Math.hypot(p.x-q.x,p.y-q.y)}
function nearNode(ll,px,filter){var best=null;NET.nodes.forEach(function(n){if(filter&&!filter(n))return;var d=screenD(ll,[n.lat,n.lng]);if(d<=px&&(!best||d<best[0]))best=[d,n]});return best&&best[1]}
function nearHead(ll,px){var best=null;HEADS.forEach(function(h){var d=screenD(ll,[h.lat,h.lng]);if(d<=px&&(!best||d<best[0]))best=[d,h]});return best&&best[1]}
map.on("click",function(e){if(MODE!=="ml"||PLACE)return;var t=ML.tool;if(!t)return;var ll=[e.latlng.lat,e.latlng.lng];
  if(t.k==="find"){var h=nearHead(ll,22);if(h){onHead(h);return}var np=nearestPipe(ll);if(np&&screenD(ll,np.ll)<=26){findFor({pipe:np.p.id},np.p.run?"this pipe ("+np.p.run+")":"this pipe");return}toast("Tap right on a head or a pipe");return}
  if(t.k==="addValve"){var np2=nearestPipe(ll);if(!np2||screenD(ll,np2.ll)>28){toast("Tap right on the pipe");return}setTool(null);newValveSheet(np2);return}
  if(t.k==="pipe"){t.pts.push(ll);drawSketch();$("#toolTxt").textContent=t.pts.length===1?"Tap along the pipe, then Finish":"Keep tapping along it, then Finish";$("#toolX").textContent=t.pts.length>1?"Finish":"Cancel";return}
  if(t.k==="link"||t.k==="feed"){var h2=nearHead(ll,22);if(h2)onHead(h2);return}
});
function drawSketch(){LGM.draw.clearLayers();var t=ML.tool;if(!t||!t.pts)return;L.polyline(t.pts,{color:"#ffcc00",weight:5,dashArray:"8 6",interactive:false}).addTo(LGM.draw);t.pts.forEach(function(p){L.circleMarker(p,{radius:5,color:"#fff",weight:2,fillColor:"#ffcc00",fillOpacity:1,interactive:false}).addTo(LGM.draw)})}

/* ---- taps on the network ---- */

/* ---- the valve finder ---- */

  if(!r.valves||!r.valves.length){drawNet();toast("Couldn't find a valve for that");return}

  var dr=dryText(SIM.dry);var vs=r.valves.map(function(id){return NI[id]});
  var b=L.latLngBounds(vs.map(function(n){return [n.lat,n.lng]}));map.fitBounds(b.pad(.25),{maxZoom:19,paddingTopLeft:[0,130],paddingBottomRight:[0,Math.round(window.innerHeight*.5)]});
  var s=sheet('<h2>Shut '+vs.length+' valve'+(vs.length===1?'':'s')+'</h2><p class="muted">To work on '+esc(label)+'.</p><div class="list">'+vs.map(valveLi).join("")+'</div>'+(r.passed&&r.passed.length?'<p class="faint" style="font-size:14px;margin-top:8px">Goes around '+r.passed.length+' valve'+(r.passed.length===1?'':'s')+' logged as seized: '+esc(r.passed.map(function(id){return vname(NI[id])}).join(", "))+'.</p>':'')+'<h3>That also turns off · '+dr.n+' head'+(dr.n===1?'':'s')+'</h3>'+(dr.n?'<table class="lay">'+dr.list.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td class="n">'+x[1]+'</td></tr>'}).join("")+'</table>':'<p class="faint">No heads, just the pipe.</p>')+'<div class="row" style="margin-top:14px"><button class="btn soft" id="fOpen">Open them all again</button></div>',{peek:true});
  wireValveLi(s);$("#fOpen").onclick=function(){ML.closed={};ML.hit={};ML.target=null;closeSheet();drawNet()};

    var sid=evId();var out=JSON.parse(JSON.stringify(NET));out.pipes.forEach(function(p){delete p._len});
    send({kind:"net",net:JSON.stringify(out),base:NETBASE||"",note:note,sid:sid});
    ML.saving={sid:sid,net:out,at:Date.now()};ls("ml.saving",ML.saving);closeSheet();ML.edit=false;ML.undo=[];ML.ops=[];setTool(null);document.body.classList.remove("mledit");try{localStorage.removeItem("ml.draft")}catch(e){}mlApply(true);toast("Saving the mainline…");pollSave()}}
function summaryOps(){var c={};ML.ops.forEach(function(o){var k=o.split(" ")[0];c[k]=(c[k]||0)+1});var w={move:"moved",add:"added",edit:"edited",remove:"removed",link:"linked heads",unlink:"unlinked heads",draw:"drew pipes",delete:"deleted pipes",merge:"tidied pipes",valve:"new valves"};return Object.keys(c).map(function(k){return (w[k]||k)+" ×"+c[k]}).join(", ")}
function pollSave(){if(!ML.saving)return;var tries=0;var iv=setInterval(function(){tries++;fetch(NETFILE+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&(d.log||[]).some(function(l){return l.sid===ML.saving.sid})){clearInterval(iv);ML.saving=null;try{localStorage.removeItem("ml.saving")}catch(e){}NET=d;NETBASE=d.updated;netIndex();drawNet();toast("Mainline saved")}else if(tries>30){clearInterval(iv);toast("Still saving. It'll show when it's through.")}}).catch(function(){})},8000)}
function loadNet(fresh){return fetch(NETFILE+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok&&TEST)return fetch("network.json?v="+Date.now(),{cache:"no-store"});return r}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(!d)return;NET=d;NETBASE=d.updated;
  var sv=ls("ml.saving");if(sv&&!fresh&&!(d.log||[]).some(function(l){return l.sid===sv.sid})&&Date.now()-sv.at<15*60000){NET=sv.net;ML.saving=sv;pollSave()}
  var dr=ls("ml.draft");if(dr&&!fresh&&!!dr.test===TEST&&dr.ops&&dr.ops.length){NET=dr.net;ML.ops=dr.ops;ML.edit=true;document.body.classList.add("mledit");if(dr.base!==d.updated)toast("Your unsaved mainline edits are back. Someone saved since, so check before saving.");else toast("Your unsaved mainline edits are back")}
  netIndex();if(MODE==="ml")mlApply(true)}).catch(function(){})}

/* ---- mode switch ---- */
function setMode(m){MODE=m;ls("hw.mode",m);document.body.classList.toggle("ml",m==="ml");$("#seg").querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===m))});$(".bar h1").textContent=m==="ml"?"Mainline":"Hardware map";if(m!=="ml")setTool(null);closeSheet();applyShow();counts();if(m==="ml"){mlApply(true);mlBar()}}
$("#seg").onclick=function(e){var b=e.target.closest("button");if(b&&b.dataset.m!==MODE)setMode(b.dataset.m)};

/* ---- Cirrus Pro: mainline and valves as small KML layers ---- */
/* Cirrus copies are simplified to within 2 m (the trace is no better than that) so the layers stay small */
function rdpLL(pts,eps){if(pts.length<3)return pts;var a=xy(pts[0]),b=xy(pts[pts.length-1]),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1e-9,best=-1,idx=0;
  for(var i=1;i<pts.length-1;i++){var q=xy(pts[i]);var d=Math.abs(dx*(q[1]-a[1])-dy*(q[0]-a[0]))/L;if(d>best){best=d;idx=i}}
  if(best>eps)return rdpLL(pts.slice(0,idx+1),eps).slice(0,-1).concat(rdpLL(pts.slice(idx),eps));return [pts[0],pts[pts.length-1]]}
function cirrusLL(p){return rdpLL(pipeLL(p),2)}
function netKmlSets(){var out=[];if(!NET)return out;
  var runs={};NET.pipes.forEach(function(p){if(p.stub)return;var k=p.run||"Mainline";(runs[k]=runs[k]||[]).push(p)});
  var parts=[],cur=[],n=0;Object.keys(runs).forEach(function(k){runs[k].forEach(function(p){var c=cirrusLL(p).length;if(n+c>CIRRUS_SMALL-10&&cur.length){parts.push(cur);cur=[];n=0}cur.push(p);n+=c})});if(cur.length)parts.push(cur);
  parts.forEach(function(ps,i){out.push({name:"HW Mainline"+(parts.length>1?" part "+(i+1)+" of "+parts.length:""),file:"HW_Mainline"+(parts.length>1?"_"+(i+1):""),col:"#38c6ff",lines:ps})});
  var sv=NET.nodes.filter(function(n){return n.k==="sv"||n.k==="mv"||n.k==="ov"}),iv=NET.nodes.filter(function(n){return n.k==="iv"});
  if(sv.length)out.push({name:"HW Mainline valves",file:"HW_Mainline_valves",col:"#0a84ff",pts:sv});
  if(iv.length)out.push({name:"HW LI-IV valves",file:"HW_LI-IV_valves",col:"#30d158",pts:iv});
  return out}
function netKml(S){var c=kmlColor(S.col);var body;
  if(S.lines)body=S.lines.map(function(p){return '<Placemark><name>'+xesc((p.run||"Mainline")+(p.mm?" "+p.mm:""))+'</name><styleUrl>#s</styleUrl><LineString><coordinates>'+cirrusLL(p).map(function(q){return q[1].toFixed(7)+","+q[0].toFixed(7)+",0"}).join(" ")+'</coordinates></LineString></Placemark>'}).join("\n");
  else body=S.pts.map(function(n){return '<Placemark><name>'+xesc(vname(n)+(n.cond==="fail"?" · seized":""))+'</name><styleUrl>#s</styleUrl><Point><coordinates>'+n.lng.toFixed(7)+','+n.lat.toFixed(7)+',0</coordinates></Point></Placemark>'}).join("\n");
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+xesc(S.name)+'</name><Style id="s"><IconStyle><color>'+c+'</color><scale>0.8</scale></IconStyle><LineStyle><color>'+c+'</color><width>3</width></LineStyle></Style>\n'+body+'\n</Document></kml>\n'}
function kmlCount(S){return S.lines?S.lines.reduce(function(a,p){return a+cirrusLL(p).length},0):S.pts.length}

/* ---------- load ---------- */
function loadLive(){return fetch("live.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{records:[]}}).catch(function(){return null})}
var DEEP=QS.get("pin"),DEEPAT=(QS.get("at")||decodeURIComponent(location.hash.replace(/^#/,""))||"").split(",").map(Number);
Promise.all([fetch("ref.json",{cache:"no-cache"}).then(function(r){return r.json()}),loadLive()]).then(function(v){
  REF=v[0];if(v[1])LIVE=v[1];
  HEADS=REF.heads.map(function(h){var p=parseHead(h[0]);return {n:h[0],lat:h[1],lng:h[2],hole:p.hole,area:p.area}});
  buildRef();drawRecords();
  if(MODE==="ml"||QS.get("map")==="mainline")setMode("ml");
  loadNet();
  $("#loading").classList.add("gone");setTimeout(function(){$("#loading").remove()},500);
  if(DEEP)deepLink();
  flush();
}).catch(function(){$("#loading").textContent="Couldn't load the map. Pull down to retry."});
function deepLink(){
  var r=find(DEEP);
  if(r){openRecord(r.id);return}
  if(DEEPAT.length===2&&!isNaN(DEEPAT[0])){
    map.setView(DEEPAT,20);
    var ghost=L.marker(DEEPAT,{icon:L.divIcon({html:'<div class="pin pending issue" style="color:#0a84ff"><svg viewBox="0 0 34 44"><path d="M17 43C17 43 3 27.5 3 17a14 14 0 0 1 28 0c0 10.5-14 26-14 26z" fill="#0a84ff" stroke="#fff" stroke-width="2"/><circle cx="17" cy="17" r="5" fill="#fff"/></svg></div>',className:"",iconSize:[34,44],iconAnchor:[17,43]})}).addTo(LG.tmp);
    toast("Pin "+DEEP+" is still syncing. It'll appear in a moment.");
    var tries=0;var iv=setInterval(function(){tries++;loadLive().then(function(d){if(d){LIVE=d;drawRecords()}if(find(DEEP)){clearInterval(iv);LG.tmp.clearLayers();openRecord(DEEP)}else if(tries>12)clearInterval(iv)})},10000);
  }
}
/* refresh the pins every minute while the page is open */
setInterval(function(){if(document.hidden||PLACE)return;loadLive().then(function(d){if(d){LIVE=d;drawRecords()}})},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();loadLive().then(function(d){if(d){LIVE=d;drawRecords()}})}});
})();
