<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ranfurlie Moisture</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
--mat:rgba(250,250,252,.72);--mat2:rgba(255,255,255,.55);--matsolid:rgba(246,246,248,.94);--label:#1d1d1f;--sec:rgba(60,60,67,.66);--ter:rgba(60,60,67,.36);
--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.22);--blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;
--shadow:0 10px 40px -12px rgba(0,0,0,.35),0 2px 8px -2px rgba(0,0,0,.12);--blur:saturate(180%) blur(28px);--ease:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{--mat:rgba(30,30,32,.66);--mat2:rgba(44,44,46,.55);--matsolid:rgba(28,28,30,.95);--label:#f5f5f7;--sec:rgba(235,235,245,.62);--ter:rgba(235,235,245,.32);
--sep:rgba(84,84,88,.5);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.34);--blue:#0a84ff;--red:#ff453a;--orange:#ff9f0a;--green:#30d158;--shadow:0 12px 44px -10px rgba(0,0,0,.7),0 2px 8px -2px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b22;font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
#map{position:fixed;inset:0;background:#0d1b22}
.leaflet-container{background:#0d1b22;font-family:var(--font)}
.leaflet-control-attribution{background:rgba(0,0,0,.35)!important;color:rgba(255,255,255,.7)!important;font-size:9px!important;backdrop-filter:blur(8px)}
.leaflet-control-attribution a{color:#fff!important}
.glass{background:var(--mat);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.18)}
/* top bar */
.top{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:1000;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.title{pointer-events:auto;border-radius:20px;padding:9px 14px 10px;min-width:0}
.title .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);display:flex;align-items:center;gap:6px}
.title .t{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,199,89,.6);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(52,199,89,.55)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.sp{flex:1}
.icbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--label);cursor:pointer;transition:transform .3s var(--ease)}
.icbtn:active{transform:scale(.92)}
.icbtn svg{width:20px;height:20px}
.pop{position:fixed;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 52px);z-index:1001;border-radius:18px;padding:6px;min-width:250px;transform-origin:top right;transform:scale(.85);opacity:0;pointer-events:none;transition:all .35s var(--ease)}
.pop.on{transform:scale(1);opacity:1;pointer-events:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;font-size:15px;cursor:pointer}
.row:active{background:var(--fill)}
.sw{margin-left:auto;width:44px;height:26px;border-radius:13px;background:var(--fill2);position:relative;transition:background .3s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--ease)}
.sw.on{background:var(--green)}.sw.on:after{transform:translateX(18px)}
/* legend */
.legend{position:fixed;right:12px;top:50%;transform:translateY(-60%);z-index:900;border-radius:16px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600;color:var(--sec)}
.legend .bar{width:8px;height:150px;border-radius:4px}
.legend .tk{position:relative;height:150px;width:22px}
.legend .tk span{position:absolute;left:0;transform:translateY(-50%)}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;height:92dvh;z-index:1000;border-radius:28px 28px 0 0;transform:translateY(calc(92dvh - var(--peek,214px)));transition:transform .55s var(--ease);display:flex;flex-direction:column;will-change:transform}
.sheet.drag{transition:none}
.grab{padding:8px 0 2px;cursor:grab;touch-action:none}
.grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--ter);margin:0 auto}
.head{padding:4px 18px 0;touch-action:none}
.scroll{overflow:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom));flex:1;overscroll-behavior:contain}
@media (min-width:900px){.sheet{left:16px;right:auto;top:calc(max(10px,env(safe-area-inset-top)) + 70px);bottom:16px;width:400px;height:auto;border-radius:28px;transform:none!important}.grab{display:none}.legend{right:16px}}
/* timeline */
.tl{display:flex;align-items:center;gap:12px;padding:6px 0 4px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .3s var(--ease);box-shadow:0 6px 16px -6px var(--blue)}
.play:active{transform:scale(.9)}.play svg{width:18px;height:18px}
.when{min-width:0;flex:1}
.when b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.when small{font-size:12px;font-weight:600;color:var(--sec)}
.when small.fc{color:var(--orange)}
.rng{position:relative;height:34px;margin:2px 0 0}
.rng input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.track{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:var(--fill2);overflow:hidden}
.track .past{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.track .fut{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(90deg,var(--orange) 0 4px,transparent 4px 7px);opacity:.55}
.thumb{position:absolute;top:6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08);pointer-events:none;transition:left .08s linear}
.ticks{position:relative;height:16px;font-size:10.5px;font-weight:600;color:var(--sec)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--fill);margin:8px 0 2px}
.seg button{flex:1;border:0;background:transparent;color:var(--label);font:600 13px var(--font);padding:7px 0;border-radius:8px;cursor:pointer;transition:background .3s var(--ease),box-shadow .3s}
.seg button.on{background:var(--matsolid);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
/* cards */
.card{background:var(--mat2);border-radius:18px;padding:14px;margin:12px 0;border:.5px solid var(--sep)}
.insight{display:flex;gap:10px;font-size:15px;line-height:1.38}
.insight svg{flex:none;width:20px;height:20px;color:var(--blue);margin-top:1px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.chip{background:var(--mat2);border:.5px solid var(--sep);border-radius:14px;padding:9px 6px;text-align:center}
.chip b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.chip span{font-size:10.5px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em}
h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:20px 2px 8px}
.list{background:var(--mat2);border-radius:18px;border:.5px solid var(--sep);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;transition:background .2s}
.li+.li{border-top:.5px solid var(--sep)}
.li:active{background:var(--fill)}
.bdg{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:15px;font-weight:600}.li .m span{font-size:13px;color:var(--sec)}
.li .v{font-size:17px;font-weight:700}
.chev{width:8px;height:14px;color:var(--ter)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gc{background:var(--mat2);border:.5px solid var(--sep);border-radius:16px;padding:8px 6px 9px;text-align:center;cursor:pointer;position:relative;transition:transform .3s var(--ease)}
.gc:active{transform:scale(.96)}
.gc canvas{width:100%;aspect-ratio:1;display:block}
.gc .n{position:absolute;left:9px;top:6px;font-weight:800;font-size:15px}
.gc b{display:block;font-size:16px;font-weight:700;line-height:1.1}.gc span{font-size:11px;color:var(--sec)}
.gc.flag:after{content:"";position:absolute;right:8px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.2)}
.note{font-size:13px;color:var(--sec);line-height:1.45;margin:8px 2px}
.src{display:grid;grid-template-columns:10px 1fr auto;gap:6px 10px;align-items:center;font-size:14px;padding:12px 14px}
.dot{width:8px;height:8px;border-radius:50%}
details{background:var(--mat2);border-radius:18px;border:.5px solid var(--sep);padding:12px 14px;margin:12px 0}
summary{font-weight:600;font-size:15px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
details p{font-size:14px;line-height:1.5;color:var(--sec);margin:10px 0 0}
/* detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:16px;font-weight:500;border:0;background:none;padding:6px 0;cursor:pointer;font-family:var(--font)}
.back svg{width:11px;height:18px}
.dt{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pill{display:inline-block;min-width:46px;text-align:center;padding:3px 8px;border-radius:999px;font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 6px}
td{padding:8px 6px;border-top:.5px solid var(--sep)}
td.h{font-weight:700}
/* map bits */
.gbadge{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:999px;font:700 12px var(--font);color:var(--label);white-space:nowrap;transform:translate(-50%,-50%);width:max-content;cursor:pointer;transition:transform .35s var(--ease)}
.gbadge i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;background:rgba(0,0,0,.55)}
.gbadge.small{padding:0;width:24px;height:24px;justify-content:center}.gbadge.small .pc{display:none}
.gbadge.sel{transform:translate(-50%,-50%) scale(1.12)}
.hlab{font:700 11px var(--font);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9);white-space:nowrap;transform:translate(-50%,-150%);width:max-content}
.pulse{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid #fff;background:rgba(255,59,48,.85);box-shadow:0 0 0 0 rgba(255,59,48,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.7)}70%{box-shadow:0 0 0 18px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.probe{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:9px;font:700 11px var(--font);color:var(--label);transform:translate(-50%,-50%);width:max-content}
.probe i{width:8px;height:8px;border-radius:2px;background:#ffd60a;box-shadow:0 0 0 2px rgba(255,214,10,.35)}
.leaflet-tooltip.gl{background:var(--matsolid);backdrop-filter:var(--blur);border:0;border-radius:12px;box-shadow:var(--shadow);color:var(--label);font:600 13px var(--font);padding:6px 10px}
.leaflet-tooltip.gl:before{display:none}
#wind{position:absolute;inset:0;z-index:450;pointer-events:none}
.fade-in{animation:fi .6s var(--ease)}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="title glass"><div class="k"><span class="live"></span><span id="upd">Loading</span></div><div class="t">Moisture</div></div>
  <div class="sp"></div>
  <button class="icbtn glass" id="home" aria-label="Whole course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="6"/></svg></button>
  <button class="icbtn glass" id="lyr" aria-label="Layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
</div>
<div class="pop glass" id="pop"></div>
<div class="legend glass"><span>Wet</span><div style="display:flex;gap:4px"><div class="bar" id="lbar"></div><div class="tk" id="ltk"></div></div><span>Dry</span></div>

<div class="sheet glass" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="head" id="hd">
    <div class="tl">
      <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <div class="when"><b id="wt">–</b><small id="ws"></small></div>
    </div>
    <div class="rng"><div class="track"><div class="past" id="tpast"></div><div class="fut" id="tfut"></div></div><div class="thumb" id="thumb"></div><input type="range" id="rng" min="0" max="1" step="0.01" value="0" aria-label="Time"></div>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="scroll" id="sc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const STOPS=[[9,[165,0,38]],[12,[215,48,39]],[14,[244,109,67]],[16,[253,174,97]],[18,[254,224,139]],[20,[166,217,106]],[23,[102,189,99]],[26,[26,152,80]],[29,[65,182,196]],[33,[44,127,184]],[38,[37,52,148]]];
function rgb(v){if(v==null||isNaN(v))return[142,142,147];if(v<=STOPS[0][0])return STOPS[0][1];for(let i=1;i<STOPS.length;i++){if(v<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i],t=(v-a)/(b-a);return ca.map((c,k)=>Math.round(c+(cb[k]-c)*t))}}return STOPS[STOPS.length-1][1]}
const LUT=new Uint8ClampedArray(801*3);for(let i=0;i<=800;i++){const c=rgb(5+i*.05);LUT[i*3]=c[0];LUT[i*3+1]=c[1];LUT[i*3+2]=c[2]}
const col=v=>`rgb(${rgb(v).join(',')})`,ink=v=>{const c=rgb(v);return(.299*c[0]+.587*c[1]+.114*c[2])>150?'#1d1d1f':'#fff'};
const fmtT=s=>{const d=new Date(s);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'pm':'am';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap};
const ord=h=>{const n=+h;if(isNaN(n))return h;return n+((n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))};
const SECT=['N','NE','E','SE','S','SW','W','NW'],sect=d=>SECT[Math.round(((d%360)+360)%360/45)%8];
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
let D,GEO,G=[],T=0,playing=false,sel=null,map,fr,L2,layers={};
const show={greens:true,course:true,heads:true,probes:true,wind:true};
const ll=(x,y)=>[fr.lat0+y/fr.ky,fr.lon0+x/fr.kx];
// value of a control point at fractional time
const pv=(p,t)=>{const i=Math.floor(t),j=Math.min(p.v.length-1,i+1),f=t-i;return p.v[i]*(1-f)+p.v[j]*f};
const fi=()=>Math.round(T);
/* ---------- green heat layer: canvas overlay per green ---------- */
const CanvasOverlay=L.ImageOverlay.extend({_initImage(){const c=this._image=this._url;L.DomUtil.addClass(c,'leaflet-image-layer');if(this._zoomAnimated)L.DomUtil.addClass(c,'leaflet-zoom-animated');c.onselectstart=L.Util.falseFn;c.onmousemove=L.Util.falseFn;this._updateOpacity()}});
const RES=.3;
function prepGreen(h){const g=D.greens[h];if(g._px)return;const xs=g.poly.map(p=>p[0]),ys=g.poly.map(p=>p[1]);
  const x0=Math.min(...xs)-.6,x1=Math.max(...xs)+.6,y0=Math.min(...ys)-.6,y1=Math.max(...ys)+.6,w=Math.ceil((x1-x0)/RES),hh=Math.ceil((y1-y0)/RES);
  const idx=[],W=[],n=g.pts.length;
  for(let j=0;j<hh;j++)for(let i=0;i<w;i++){const x=x0+(i+.5)*RES,y=y1-(j+.5)*RES;if(!pip(x,y,g.poly))continue;idx.push(j*w+i);let s=0;const ws=new Array(n);
    for(let k=0;k<n;k++){const dx=x-g.pts[k].x,dy=y-g.pts[k].y,q=Math.max(dx*dx+dy*dy,.01);ws[k]=1/q;s+=ws[k]}for(let k=0;k<n;k++)W.push(ws[k]/s)}
  g._px={x0,x1,y0,y1,w,h:hh,idx:Int32Array.from(idx),W:Float32Array.from(W),n};
  const c=document.createElement('canvas');c.width=w;c.height=hh;g._cv=c;g._ctx=c.getContext('2d');g._img=g._ctx.createImageData(w,hh);
  // cells (1 m) for stats + head ownership
  g._c=[];for(let x=Math.floor(Math.min(...xs));x<=Math.max(...xs);x++)for(let y=Math.floor(Math.min(...ys));y<=Math.max(...ys);y++){if(pip(x+.5,y+.5,g.poly))g._c.push([x+.5,y+.5])}
  g._cw=g._c.map(([x,y])=>{let s=0;const ws=g.pts.map(p=>{const q=Math.max((x-p.x)**2+(y-p.y)**2,.01);s+=1/q;return 1/q});return ws.map(v=>v/s)});
  g._own=g._c.map(([x,y])=>{let b=null,bd=1e9;for(const hd of g.heads){const d=(hd.x-x)**2+(hd.y-y)**2;if(d<bd){bd=d;b=hd.n}}return b});
  const r=(g.play||0)*Math.PI/180;g._cos=Math.cos(r);g._sin=Math.sin(r)}
function paintGreen(h){const g=D.greens[h],P=g._px,img=g._img.data,ok=g.qa==='turfrad';const vals=g.pts.map(p=>pv(p,T));
  img.fill(0);for(let a=0;a<P.idx.length;a++){const o=P.idx[a]*4;let v=0;const b=a*P.n;for(let k=0;k<P.n;k++)v+=P.W[b+k]*vals[k];
    if(ok){let li=Math.round((v-5)*20);li=li<0?0:li>800?800:li;img[o]=LUT[li*3];img[o+1]=LUT[li*3+1];img[o+2]=LUT[li*3+2];img[o+3]=235}
    else{const s=((P.idx[a]%P.w)+Math.floor(P.idx[a]/P.w))%8<3;img[o]=s?200:150;img[o+1]=s?205:155;img[o+2]=s?210:160;img[o+3]=170}}
  g._ctx.putImageData(g._img,0,0)}
const cellVals=(g,t)=>{const vals=g.pts.map(p=>pv(p,t));return g._cw.map(w=>w.reduce((s,wk,k)=>s+wk*vals[k],0))};

function glide(to){stopPlay();const from=T,t0=performance.now(),d=650;const step=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);T=from+(to-from)*e;draw();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
let pl=0;function stopPlay(){playing=false;$('play').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'}
$('play').onclick=()=>{if(playing)return stopPlay();playing=true;$('play').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>';if(T>=D.frames.length-1.01)T=0;let last=performance.now();
  const step=n=>{if(!playing)return;T=Math.min(D.frames.length-1,T+(n-last)/1000*1.6);last=n;draw();if(T>=D.frames.length-1){stopPlay();return}requestAnimationFrame(step)};requestAnimationFrame(step)};
/* ---------- layers popover ---------- */
const LY=[['greens','Greens heat'],['course','Fairways, surrounds & tees (scan)'],['heads','Sprinklers'],['probes','Probes'],['wind','Wind']];
function pop(){$('pop').innerHTML=LY.map(([k,l])=>`<div class="row" data-k="${k}">${l}<span class="sw${show[k]?' on':''}"></span></div>`).join('');
  $('pop').querySelectorAll('.row').forEach(r=>r.onclick=()=>{const k=r.dataset.k;show[k]=!show[k];r.querySelector('.sw').classList.toggle('on',show[k]);
    if(k==='greens'){toggle(layers.greens,show.greens)}if(k==='course')toggle(layers.course,show.course);if(k==='heads'||k==='probes')zoomDeco()})}
$('lyr').onclick=e=>{e.stopPropagation();$('pop').classList.toggle('on')};document.addEventListener('click',e=>{if(!$('pop').contains(e.target))$('pop').classList.remove('on')});
$('home').onclick=()=>{sel=null;lastSheet='';home();draw()};
/* ---------- boot ---------- */
async function load(first){const q='?t='+Date.now();const[d,geo]=await Promise.all([fetch('data.json'+q).then(r=>r.json()),first?fetch('geo_lite.json'+q).then(r=>r.json()):Promise.resolve(GEO)]);
  if(!first){const keepT=Math.abs(T-D.i_now)<.05;D.greens&&Object.values(D.greens).forEach(g=>{});const old=D;D=d;G.forEach(h=>{const g=D.greens[h],o=old.greens[h];if(!g||!o)return;Object.assign(g,{_px:o._px,_cv:o._cv,_ctx:o._ctx,_img:o._img,_c:o._c,_own:o._own,_ov:o._ov,_bd:o._bd,_cos:o._cos,_sin:o._sin});
    g._cw=g._c.map(([x,y])=>{let s=0;const ws=g.pts.map(p=>{const q=Math.max((x-p.x)**2+(y-p.y)**2,.01);s+=1/q;return 1/q});return ws.map(v=>v/s)});const P=g._px;if(P&&g.pts.length!==P.n){g._px=null;prepGreen(h)}
    g.heads.forEach((hd,i)=>hd._lab=o.heads[i]&&o.heads[i]._lab)});if(keepT)T=D.i_now;T=Math.min(T,D.frames.length-1);ticks();lastSheet='';draw();upd();return}
  D=d;GEO=geo;G=Object.keys(D.greens).sort((a,b)=>(+a)-(+b));T=D.i_now;$('rng').max=D.frames.length-1;
  const lb=$('lbar'),vals=[34,30,26,22,18,14,10];lb.style.background='linear-gradient(180deg,'+[34,32,30,28,26,24,22,20,18,16,14,12,10].map(v=>col(v)).join(',')+')';$('ltk').innerHTML=vals.map((v,i)=>`<span style="top:${i/(vals.length-1)*100}%">${v}</span>`).join('');
  buildMap();pop();ticks();snap(0);upd();draw()}
function upd(){const g=new Date(D.generated);$('upd').textContent='Live · '+fmtT(D.generated)+(D.stale?' · no scan today':'')}
load(true).catch(e=>{$('upd').textContent='Could not load data';console.error(e)});
setInterval(()=>{if(!playing&&!document.hidden)load(false).catch(()=>{})},5*60*1000);
addEventListener('resize',()=>{snap(det)});
</script>
